# JCTsh Air Quality Monitor — ESPHome Configuration
# Hardware: ESP32 DevKitC-32 (38-pin, CP2102 USB-C)
#           + Sensirion SEN55 (I2C 0x69, via Adafruit #5964 adapter) — PM1.0/2.5/4.0/10, VOC, NOx
#             SEN55 is hard-wired always-on whenever the device has power (see
#             Step 6 decision below) — no dedicated power-gate transistor.
#           + RGB LED (KY-016) — GPIO18/19/23 (pins 30/31/37). PM2.5 threshold
#             indicator (Red/Green combos) + boot self-test/init sequence +
#             brief per-reading blink (Step 5). Blue is dedicated entirely to
#             networking-status diagnostics (Step 8) — see the WiFi Gate
#             Diagnostics section below.
#           + Dock detect: TP4056 IN+ (or solar) → 68kΩ+100kΩ divider → GPIO32 (pin 7)
#           + Battery voltage divider → GPIO34 (pin 5, input-only)
#           + Intent switch: repurposed SS12D10 slide switch → GPIO27 (pin 11),
#             INPUT_PULLUP + inverted (CARD-0218, Step 8) — state TRUE = switch
#             closed = actively collecting field data, same semantic as
#             hiking-monitor's own slide_switch.
#           + EEMB 1100mAh LiPo + TP4056 (charging only) + Pololu D24V10F3 buck-
#             boost regulator (CARD-0198, replaces the original MCP1700 LDO) +
#             inline power switch (BK-1208, gates only the Pololu's VIN — see
#             wiring.md's "Inline Power Switch" section for the shared-node
#             topology and why it does NOT isolate TP4056's own charge path)
#
# STEP 8 (2026-09-09): field/home mode duty-cycle firmware.
# CARD-0377 Phase 2 (2026-10-01): MQTT removed entirely. A persistent broker
# session needed its own attempt-window/backoff/enable-disable state machine
# to manage; a one-shot upload doesn't. When eligible, the device now just
# enables WiFi, does ONE HTTP POST of the whole buffered log to the
# data-pipeline gateway's bulk endpoint, and clears on confirmed success --
# no flag tracks "was this replayed," so there's nothing left to get stuck
# (the actual bug CARD-0346 patched twice and this redesign deletes outright).
# Three independent signals still gate any upload attempt
# (JCTsh-Build-Standards.md §2.14 points 11-13) — Intent off AND Power
# Connected AND battery >= the upload-safe margin (3.5V, revised 2026-09-09
# from an original 3.8V -- see CARD-0012: CARD-0198's brownout finding came
# from a deliberate battery-ALONE stress trial, a scenario the other two
# conditions already prevent; the well-tested docked case (TP4056 supplying
# the burst current, not the battery) was clean at every voltage tried, so
# only a small margin above the confirmed-catastrophic 3.4V floor is kept,
# for the untested weak/solar-charger case). None of these signals ever
# stand in for another. Field-mode duty-cycle logging (SEN55 I2C
# mode-switching, Measurement <-> RHT/Gas-Only) runs independent of
# dock-detect state — a deliberate deviation from hiking-monitor's pattern
# (which stops field logging the instant dock-detect goes HIGH), because
# solar/field-USB charging can happen mid-collection on this device just as
# easily as at home. It IS gated on the Intent switch: Intent ON means
# "actively collecting field data," matching hiking-monitor's own
# Intent-switch semantics (see wiring.md's Intent Switch Wiring section).
#
# STEP 6 DECISION (2026-08-21): no dedicated SEN55 power-gate transistor.
# Sensirion's own "Reduced Power Operation for SEN5x" doc recommends I2C
# mode-switching (Measurement ↔ RHT/Gas-Only) as the primary duty-cycle
# power-saving mechanism, not physically cutting power — and the existing
# inline power switch (battery+ path, Step 1) already covers true full-off
# for storage/transport. SEN55 stays hard-wired to the common ground rail.
#
# GPIO assignments (ESP32-project-pins.md has the full 38-pin table):
#   GPIO21  I2C SDA (SEN55 via Adafruit adapter) — blue
#   GPIO22  I2C SCL — yellow
#   GPIO27  Intent switch (pin 11, CARD-0218/Step 8) — INPUT_PULLUP, inverted
#   GPIO17  Debug UART2 TX (CARD-0205, 2026-08-24) — external CP2102 adapter,
#           transmit-only. ESP32's fixed UART2 TX pin (not remappable via
#           ESPHome's logger component — see logger: block below)
#   GPIO32  Dock detect (TP4056 IN+ or solar → divider, HIGH = docked/charging)
#   GPIO34  Battery voltage ADC (100kΩ/100kΩ divider, post-switch node — wiring.md)
#
# CARD-0377 Phase 2: no MQTT at all, so no topics to list here anymore. Data
# goes to the data-pipeline gateway's bulk-upload endpoint over plain HTTP
# POST (see secrets.yaml's data_pipeline_bulk_url); dashboard visibility is
# the gateway's own job (it relays onto MQTT itself via hike-izer-
# orchestrator's existing /webhook/pipeline-log, same mechanism other tables
# already use -- this device has no MQTT client to do that itself, same
# constraint data-pipeline-api's own app.py already documents for itself).
# No heartbeat either -- it could only ever fire while connected (docked),
# so on every real field day it only produced false "silent for N hours"
# watchdog alerts for a device whose whole job is being unreachable for
# hours at a stretch (confirmed live, CARD-0377: four such alerts fired
# during one normal 2026-10-01 hike).

esphome:
  name: air-quality-monitor
  friendly_name: Air Quality Monitor
  includes:
    - aqm_logger.h
  on_boot:
    - priority: -100.0
      then:
        # Workaround for a confirmed ESPHome bug (found in minimal-test.yaml,
        # 2026-08-28): logger_esp32.cpp calls uart_param_config()/
        # uart_driver_install() for hardware_uart: UART2 but never
        # uart_set_pin() -- the peripheral runs but is never actually routed
        # through the GPIO matrix to GPIO17, so nothing reaches the external
        # debug adapter without this manual call. Must run before anything
        # else logs, so as much of the boot sequence as possible is captured.
        - lambda: |-
            uart_set_pin(UART_NUM_2, GPIO_NUM_17, UART_PIN_NO_CHANGE, UART_PIN_NO_CHANGE, UART_PIN_NO_CHANGE);
        # ── CARD-0377 Phase 2: disable WiFi by default at boot ──
        # ESPHome's wifi: component tries to associate automatically and
        # unconditionally during its own setup() -- nothing stops it by
        # default (the exact latent gap CARD-0217 found and fixed on
        # hiking-monitor). This device's on_boot block is priority -100,
        # which is LOWER than WiFi's fixed setup_priority of 250 -- lower
        # priority numbers run LATER, so WiFi's setup() has *already
        # completed* by the time this block runs, letting it call
        # wifi.disable() directly within milliseconds of boot. Simplified
        # from the old eligibility-checking-with-its-own-LED-diagnostics
        # version: the first 2-min interval tick (which fires "essentially
        # immediately" after boot, per the duty-cycle block's own comment
        # below) now owns the entire eligibility check and upload attempt,
        # including whatever it's eligible to do right away -- on_boot's
        # only job is to make sure WiFi starts disabled, a safe default,
        # not to duplicate that logic here too.
        - wifi.disable:
        - component.update: battery_voltage
        # ── Existing SEN55/reset-reason/self-test sequence (Steps 4-6), unchanged ──
        # Force SEN55 into Idle mode (~2.6mA) — moved ahead of the
        # reset-reason LED block, 2026-08-24, after live testing showed the
        # original ordering still left SEN55 running full ~63mA Measurement
        # mode (auto-started by its own sen5x platform setup(), priority
        # ~600, well before this script's priority -100.0) through the
        # entire reset-reason LED delay before ever being told to idle down.
        - lambda: 'id(sen55).write_command((uint16_t) 0x3f86);'  # SEN5X_CMD_STOP_MEASUREMENTS -> Idle mode
        # Reset-reason LED signal — added 2026-08-21. Live serial isn't safe
        # on battery power; MQTT-based reporting only works if the device
        # gets far enough to connect. The LED has no such dependency.
        - if:
            condition:
              lambda: |-
                std::string reason = id(reset_reason_text).state;
                return reason.find("rownout") != std::string::npos ||
                       reason.find("glitch") != std::string::npos;
            then:
              - output.turn_on: rgb_led_red
              - delay: 3s
              - output.turn_off: rgb_led_red
            else:
              - output.turn_on: rgb_led_blue
              - delay: 1s
              - output.turn_off: rgb_led_blue
        # Boot self-test LED sequence: two quick blinks per color (Blue, Red,
        # Yellow, Green), then blink Green with NO timeout until SEN55
        # produces a first valid PM2.5 reading.
        - repeat:
            count: 2
            then:
              - output.turn_on: rgb_led_blue
              - delay: 300ms
              - output.turn_off: rgb_led_blue
              - delay: 300ms
        - repeat:
            count: 2
            then:
              - output.turn_on: rgb_led_red
              - delay: 300ms
              - output.turn_off: rgb_led_red
              - delay: 300ms
        - repeat:
            count: 2
            then:
              - output.turn_on: rgb_led_red
              - output.turn_on: rgb_led_green
              - delay: 300ms
              - output.turn_off: rgb_led_red
              - output.turn_off: rgb_led_green
              - delay: 300ms
        - repeat:
            count: 2
            then:
              - output.turn_on: rgb_led_green
              - delay: 300ms
              - output.turn_off: rgb_led_green
              - delay: 300ms
        - delay: 1s
        # CARD-0377 Phase 2: the old bounded wait-for-MQTT-connection block
        # (and its own "attempting" LED pattern) lived here -- removed along
        # with the attempt-window state machine it was reporting on. The
        # 2-min interval tick now owns the whole eligibility-check-and-upload
        # attempt asynchronously; on_boot doesn't block waiting for it.
        # Resume full Measurement mode for one real boot-time reading (proves
        # the sensor works, drives the self-test's "wait for first valid
        # reading" below) -- the ongoing duty-cycle interval takes over from
        # here once this boot sequence hands off (see the RHT-only command
        # at the very end of this block).
        - lambda: 'id(sen55).write_command((uint16_t) 0x0021);'  # SEN5X_CMD_START_MEASUREMENTS
        - delay: 2s   # let the SEN55 fan/sensor settle before forcing a first read
        - component.update: sen55
        - component.update: battery_voltage
        - lambda: 'id(pm25_wait_start) = millis();'
        - while:
            condition:
              lambda: |-
                return isnan(id(sen55_pm25).state) &&
                       (millis() - id(pm25_wait_start)) < 30000;
            then:
              - output.turn_on: rgb_led_green
              - delay: 400ms
              - output.turn_off: rgb_led_green
              - delay: 400ms
        - output.turn_on: rgb_led_green
        - delay: 2s
        - output.turn_off: rgb_led_green
        - lambda: 'id(boot_sequence_done) = true;'
        # Threshold-color confirmation: hold solid Yellow then solid Red for 3s each.
        - delay: 1s
        - output.turn_on: rgb_led_red
        - output.turn_on: rgb_led_green
        - delay: 3s
        - output.turn_off: rgb_led_red
        - output.turn_off: rgb_led_green
        - delay: 500ms
        - output.turn_on: rgb_led_red
        - delay: 3s
        - output.turn_off: rgb_led_red
        # STEP 8: hand off to the ongoing duty cycle -- drop to RHT/Gas-Only
        # mode now; the 2-min interval below brings it back to Measurement
        # mode briefly each cycle.
        - lambda: 'id(sen55).write_command((uint16_t) 0x0037);'  # SEN5X_CMD_START_MEASUREMENTS_RHT_ONLY
        - lambda: 'aqm_log_begin();'

esp32:
  board: esp32dev
  framework:
    type: arduino

# ── Debug / reset reason ──────────────────────────────────────────────────────
debug:

# ── Globals ───────────────────────────────────────────────────────────────────
globals:
  # Gates the pm_2_5 on_value LED handler below so it doesn't fight the boot
  # self-test animation above over the same GPIO outputs.
  - id: boot_sequence_done
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: pm25_wait_start
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # CARD-0377 Phase 2: the old WiFi attempt-window/backoff state machine
  # (wifi_gate_ok, wifi_attempt_in_progress, wifi_attempt_start_ms,
  # wifi_last_attempt_end_ms), the replay-deferred flag, and the whole
  # aqm_log_replayed/intent_last_polled_state stuck-flag mechanism all lived
  # here -- deleted along with MQTT. A one-shot upload doesn't need any of
  # them: eligibility is re-checked fresh every 2-min tick (no backoff
  # bookkeeping needed, since ESPHome's own wifi: component already retries
  # sensibly on its own), and the log is cleared only after a confirmed
  # upload success, so there's no "was this already replayed" state to track
  # or get stuck.
  # CARD-0343 (2026-09-26): identifies this boot in readings buffered while the clock is invalid,
  # so a replay can tell "same boot as the run -- convert uptimes to real times exactly" from
  # "an earlier boot -- leave the reading tagged". 0 = not yet assigned (set by the first such
  # reading); never persisted, so every boot gets a fresh one.
  - id: boot_id
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # STEP 8 fix (2026-09-09, real bug found on first bench test): a CRC
  # failure on the SEN55 I2C read leaves sensor.state at its last
  # successfully-published value rather than NaN -- an isnan() check alone
  # can't tell "genuinely fresh reading" from "stale leftover from an
  # earlier successful cycle." sen55_last_update_ms is stamped inside
  # pm_2_5's own on_value handler (fires only on an actual successful
  # publish, i.e. only when the CRC check passed); the duty-cycle interval
  # stamps duty_cycle_read_start_ms right before asking for a new read, and
  # only trusts the reading if the former is >= the latter -- proof a real
  # publish happened *after* this cycle's own read request, not before it.
  - id: sen55_last_update_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: duty_cycle_read_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # STEP 8 fix (2026-09-09, real gap found bench-testing on battery alone):
  # this device had NO general low-battery cutoff at all -- unlike
  # hiking-monitor's deep-sleep-based low_battery_shutdown, required
  # regardless of mode by JCTsh-Build-Standards.md §2.14 point 2. This
  # device has no deep-sleep/wake-source architecture, so the equivalent
  # protective action is skipping the ~63mA Measurement-mode burst entirely
  # below 3.4V (the same documented catastrophic floor as hiking-monitor and
  # this device's own Pololu regulator) -- RHT-only idle current is much
  # lower and safe to leave running. Logged once per dip (not every 2-min
  # cycle) via this flag, reset once voltage recovers above the floor.
  - id: critical_battery_alerted
    type: bool
    restore_value: false
    initial_value: 'false'

# ── WiFi ──────────────────────────────────────────────────────────────────────
# Multi-network (portable component): home WiFi first, Pixel hotspot second.
# `ap:` fallback included (standard default per JCTsh-Build-Standards.md §2.8).
# CARD-0377 Phase 2: the old on_connect SSID-based MQTT-broker-hostname switch
# (LAN-local pi1.local vs. DuckDNS) is gone along with MQTT itself -- the
# bulk-upload endpoint is one fixed public URL (data_pipeline_bulk_url)
# reached identically whichever network this lands on, so there's no
# per-network destination to pick anymore.
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret hotspot_ssid
      password: !secret hotspot_password
  ap:
    ssid: "air-quality-monitor-fallback"
    password: !secret ap_password

captive_portal:

# ── Logging ───────────────────────────────────────────────────────────────────
logger:
  level: INFO
  hardware_uart: UART2  # CARD-0205 secondary debug UART -- external CP2102 adapter, GPIO17

# ── OTA updates ───────────────────────────────────────────────────────────────
# First flash: USB from C:\esphome\air-quality-monitor\
# All subsequent updates: OTA — esphome run air-quality-monitor.yaml
ota:
  - platform: esphome
    password: !secret ota_password

# ── NTP time sync ─────────────────────────────────────────────────────────────
# No RTC hardware. Timestamps for buffered field-mode readings are built from
# this clock — matches hiking-monitor's exact pattern (`sntp_time`, same
# timezone/servers).
time:
  - platform: sntp
    id: sntp_time
    timezone: America/Phoenix
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org

# ── HTTP (CARD-0377 Phase 2 -- replaces MQTT entirely) ────────────────────────
# A one-shot bulk POST doesn't need a persistent, TLS-encrypted, always-
# reconnecting broker session -- it needs one request. verify_ssl: false is a
# deliberate, explicit choice, not an oversight: hikes.jctnet.com is fronted
# by Cloudflare's own edge certificate (not a cert this project controls or
# can easily pin), and the existing mqtt_ca_cert secret is Let's Encrypt's
# root, which doesn't apply here. The connection is still TLS-encrypted in
# transit; what's skipped is chain validation. Same pragmatic tier as this
# file's own prior skip_cert_cn_check: true for MQTT, and the Bearer API key
# still provides application-level authentication regardless.
http_request:
  verify_ssl: false
  timeout: 15s

# ── I2C ───────────────────────────────────────────────────────────────────────
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# ── RGB LED ───────────────────────────────────────────────────────────────────
output:
  - platform: gpio
    pin: GPIO18
    id: rgb_led_red
  - platform: gpio
    pin: GPIO19
    id: rgb_led_green
  - platform: gpio
    pin: GPIO23
    id: rgb_led_blue

# ── Upload script (CARD-0377 Phase 2 -- replaces the old MQTT replay loop) ───
# One-shot: if there's buffered data, enable WiFi, POST the whole log in a
# single request to the data-pipeline gateway's bulk endpoint, clear only on
# a confirmed 200. No persistent-connection bookkeeping (no attempt-window,
# no backoff, no "was this already replayed" flag) -- a one-shot request has
# nothing to manage between attempts; eligibility is just re-checked fresh
# on the next 2-min tick if this one didn't succeed.
script:
  - id: attempt_aqm_upload
    then:
      - if:
          condition:
            lambda: 'return !aqm_log_has_data();'
          then:
            - lambda: 'return;'  # nothing buffered -- nothing to do
      # CARD-0343 (2026-09-26): give the clock up to 5 min to sync before
      # uploading, so uptime-tagged readings from THIS boot can be resolved
      # to real timestamps exactly, same reasoning as the old replay script
      # (SNTP measured taking >60s after WiFi comes up on a cold boot).
      # Times out and uploads anyway -- a failed sync never blocks the
      # upload, it just leaves this boot's unresolved readings unresolved.
      - if:
          condition:
            lambda: 'return id(boot_id) != 0 && !id(sntp_time).now().is_valid();'
          then:
            - wait_until:
                condition:
                  lambda: 'return id(sntp_time).now().is_valid();'
                timeout: 300s
      # CARD-0377 Phase 2 bug found live (2026-10-01, first real OTA test):
      # this used to call aqm_log_write() for its own "upload_attempt_start"
      # marker -- but that writes into the SAME file aqm_log_build_bulk_body()
      # reads to build the next POST's body, so the marker itself got sent
      # as a fake "reading" and flagged invalid server-side, and a matching
      # on_response marker below did the same after clear() -- a self-sustaining
      # 2-line loop that never stopped (confirmed live: every 2-min upload
      # carried exactly 2 "invalid" entries, forever). aqm_log.jsonl must
      # hold ONLY real sensor readings; all status logging below is
      # ESP_LOGW-only (serial, no remote channel exists without MQTT/api:).
      - lambda: |-
          ESP_LOGW("Upload", "Starting upload of %d buffered readings", aqm_log_count());
      - wifi.enable:
      - http_request.post:
          url: !secret data_pipeline_bulk_url
          request_headers:
            Content-Type: application/json
            Authorization: !secret data_pipeline_auth_header
          body: !lambda |-
            // Only pass a real current_time/current_boot pair if the clock is
            // actually valid -- an empty boot string can never match a real
            // 8-hex-char boot id, so readings correctly stay "unresolved"
            // server-side rather than risk resolving against a bogus time.
            ESPTime rnow = id(sntp_time).now();
            std::string ts_str = "1970-01-01T00:00:00Z";
            std::string boot_str = "";
            if (rnow.is_valid()) {
              time_t epoch = (time_t) rnow.timestamp;
              struct tm utc_tm;
              gmtime_r(&epoch, &utc_tm);
              char ts[25];
              strftime(ts, sizeof(ts), "%Y-%m-%dT%H:%M:%SZ", &utc_tm);
              ts_str = std::string(ts);
              char boot_hex[9];
              snprintf(boot_hex, sizeof(boot_hex), "%08x", (unsigned) id(boot_id));
              boot_str = std::string(boot_hex);
            }
            return aqm_log_build_bulk_body(ts_str, boot_str, (uint32_t)(millis() / 1000));
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    aqm_log_clear();
                    ESP_LOGW("Upload", "Upload complete (status %d) -- log cleared", response->status_code);
                  } else {
                    ESP_LOGW("Upload", "Upload failed (status %d) -- log kept for retry", response->status_code);
                  }
          on_error:
            then:
              - lambda: 'ESP_LOGW("Upload", "Upload error (no response) -- log kept for retry");'

# ── Sensors ───────────────────────────────────────────────────────────────────
sensor:
  # SEN55 — native sen5x platform. update_interval matches the 2-min duty-
  # cycle tick below; the actual mode-switching (RHT-only <-> Measurement)
  # and read timing is driven explicitly from the interval, not from this
  # platform's own independent polling.
  - platform: sen5x
    id: sen55
    address: 0x69
    update_interval: 2min
    pm_1_0:
      name: "PM 1.0"
      id: sen55_pm1
      internal: true
    pm_2_5:
      name: "PM 2.5"
      id: sen55_pm25
      internal: true
      on_value:
        then:
          # STEP 8 fix: stamps on every genuine successful publish (fires
          # regardless of boot_sequence_done, unlike the LED handler below)
          # -- see sen55_last_update_ms's own comment in the globals block.
          - lambda: |-
              if (!isnan(x)) {
                id(sen55_last_update_ms) = millis();
              }
          - if:
              condition:
                lambda: 'return id(boot_sequence_done) && !isnan(x);'
              then:
                - lambda: |-
                    if (x < 12.0f) {
                      id(rgb_led_red).turn_off();
                      id(rgb_led_green).turn_on();
                      id(rgb_led_blue).turn_off();
                    } else if (x <= 35.0f) {
                      id(rgb_led_red).turn_on();
                      id(rgb_led_green).turn_on();
                      id(rgb_led_blue).turn_off();
                    } else {
                      id(rgb_led_red).turn_on();
                      id(rgb_led_green).turn_off();
                      id(rgb_led_blue).turn_off();
                    }
                - delay: 1s
                - output.turn_off: rgb_led_red
                - output.turn_off: rgb_led_green
                - output.turn_off: rgb_led_blue
    pm_4_0:
      name: "PM 4.0"
      id: sen55_pm4
      internal: true
    pm_10_0:
      name: "PM 10.0"
      id: sen55_pm10
      internal: true
    voc:
      name: "VOC Index"
      id: sen55_voc
      internal: true
    nox:
      name: "NOx Index"
      id: sen55_nox
      internal: true
    # CARD-0218: SEN55's own temperature/humidity, kept separate from
    # hiking-monitor's BME280 (source: air-quality-monitor, not a
    # duplicate) -- intended as an independent reference to compare
    # against, given this device's mounting/placement may read more
    # accurately. temperature_compensation/acceleration_mode left at
    # default deliberately (Joseph's call).
    temperature:
      name: "Temperature"
      id: sen55_temp
      internal: true
      filters:
        - lambda: return x * 9.0/5.0 + 32.0;   # C -> F, matching this project's °F convention
      unit_of_measurement: "°F"
    humidity:
      name: "Humidity"
      id: sen55_humidity
      internal: true

  # Battery voltage — voltage divider on GPIO34 (100kΩ + 100kΩ → 2:1 divider),
  # post-switch node (wiring.md, verified 2026-09-08).
  - platform: adc
    pin: GPIO34
    name: "Battery Voltage"
    id: battery_voltage
    attenuation: 12db
    update_interval: 30s
    filters:
      - multiply: 2.0
    unit_of_measurement: "V"
    accuracy_decimals: 2
    internal: true

  # Internal sensors used in on_connect/heartbeat lambdas
  - platform: uptime
    id: uptime_sec
    internal: true

  - platform: wifi_signal
    id: wifi_rssi
    internal: true
    update_interval: 60s

# ── WiFi IP (used in on_connect log message) ──────────────────────────────────
text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true
    ssid:
      id: wifi_ssid_sensor
      internal: true
  - platform: debug
    reset_reason:
      id: reset_reason_text
      internal: true

# ── Binary sensors ────────────────────────────────────────────────────────────
binary_sensor:
  # Intent switch — repurposed SS12D10 slide switch (CARD-0218, Step 8),
  # GPIO27 (pin 11), same pin/pattern as hiking-monitor's own slide_switch.
  # State TRUE = switch closed = actively collecting field data.
  - platform: gpio
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Intent Switch"
    id: intent_switch
    internal: true
    # CARD-0377 Phase 2: no on_press handler -- the old one existed only to
    # clear aqm_log_replayed/discard an already-replayed log the moment a
    # new field run started. There's no "replayed" flag anymore (a one-shot
    # upload either clears the log on confirmed success or leaves it
    # untouched on failure), so there's nothing left for a press trigger to
    # do; a new run just appends to whatever the log already holds.

  # Dock detect: TP4056 IN+ (or solar) -> 68kΩ -> midpoint -> 100kΩ -> GND;
  # midpoint to GPIO32. HIGH = docked/charging or solar connected.
  - platform: gpio
    pin:
      number: GPIO32
      mode: INPUT
    name: "Dock Detect"
    id: dock_detect
    internal: true

# ── Duty-cycle / field logging / upload-eligibility interval ──────────────────
interval:
  - interval: 2min
    then:
      # ── CARD-0377 Phase 2: eligibility check (replaces the WiFi-gate state
      # machine, attempt-window/15min backoff, and wifi/mqtt enable-disable
      # mirroring entirely) ──
      # A one-shot HTTP upload has no persistent connection to manage between
      # attempts, so there's nothing to track across ticks: just ask "is it
      # safe and worth trying right now?" fresh every time. Intent off (not
      # actively hiking), docked/charging (power_connected), and battery
      # above the 3.5V upload-safe threshold -- same three conditions as
      # before, just no longer needing a state machine to act on them.
      - lambda: |-
          bool intent_off = !id(intent_switch).state;
          bool power_connected = id(dock_detect).state;
          bool voltage_ok = !isnan(id(battery_voltage).state) && id(battery_voltage).state >= 3.5f;
          bool eligible = intent_off && power_connected && voltage_ok && aqm_log_has_data();
          ESP_LOGW("UploadState", "eligible=%d intent_off=%d power=%d voltage_ok=%d has_data=%d",
                   eligible, intent_off, power_connected, voltage_ok, aqm_log_has_data());
      - if:
          condition:
            lambda: |-
              bool intent_off = !id(intent_switch).state;
              bool power_connected = id(dock_detect).state;
              bool voltage_ok = !isnan(id(battery_voltage).state) && id(battery_voltage).state >= 3.5f;
              return intent_off && power_connected && voltage_ok && aqm_log_has_data();
          then:
            - script.execute: attempt_aqm_upload
          else:
            # Nothing eligible to upload right now -- make sure the radio
            # isn't left on burning idle current (it's only ever turned on
            # by the upload script itself, and turned back off there too on
            # a completed attempt; this is just the steady-state default).
            - wifi.disable:

      # ── STEP 8: SEN55 duty-cycle -- warm up, read, drop back to RHT-only ──
      # STEP 8 fix (2026-09-09, real race condition found on first bench
      # test): on_boot's own YAML-level delay:/while: actions are
      # non-blocking automations, not a single blocking script -- loop()
      # (and therefore this interval) can start running *while on_boot is
      # still mid-sequence*. Without this gate, on_boot's own SEN55
      # write_command calls (Idle -> Measurement -> RHT-only) and this
      # block's calls can genuinely race on the same I2C bus -- almost
      # certainly the real cause of CARD-0252's CRC failures, not a hardware
      # flake as first assumed. Confirmed directly: the very first tick fired
      # only 4.5s after "setup() finished successfully," far too early for
      # on_boot's reset-reason-check + 8-blink self-test + bounded MQTT wait
      # to have actually completed. Skip this whole block entirely until
      # on_boot's own sequence has genuinely finished.
      - if:
          condition:
            lambda: 'return id(boot_sequence_done);'
          then:
            # STEP 8 fix (2026-09-09): general low-battery cutoff, required
            # by JCTsh-Build-Standards.md §2.14 point 2 regardless of mode --
            # this device had none at all until a real bench test on battery
            # alone surfaced the gap. No deep-sleep architecture exists here
            # (unlike hiking-monitor), so the equivalent protective action is
            # skipping the ~63mA Measurement-mode burst entirely below 3.4V
            # -- RHT-only idle current is much lower and safe to leave
            # running (voltage keeps being monitored via the existing 30s
            # ADC poll). Logged once per dip, not every 2-min cycle.
            - component.update: battery_voltage
            - if:
                condition:
                  lambda: 'return !isnan(id(battery_voltage).state) && id(battery_voltage).state < 3.4f;'
                then:
                  - if:
                      condition:
                        lambda: 'return !id(critical_battery_alerted);'
                      then:
                        - lambda: |-
                            // CARD-0377 Phase 2: no longer aqm_log_write() --
                            // that buffer now holds ONLY real sensor readings
                            // (see the upload script's comment for why mixing
                            // status markers into it broke the bulk upload).
                            id(critical_battery_alerted) = true;
                            ESP_LOGW("DutyCycle", "Critical battery %.2fV - Measurement mode suspended until charge recovers",
                                     id(battery_voltage).state);
                else:
                  - lambda: 'id(critical_battery_alerted) = false;'
            - if:
                condition:
                  lambda: |-
                    return (isnan(id(battery_voltage).state) || id(battery_voltage).state >= 3.4f)
                        && id(intent_switch).state;
                then:
                  # Idle in RHT/Gas-Only mode between cycles (set at the end
                  # of on_boot and again at the end of this block). ~40s
                  # warm-up before reading, within Sensirion's recommended
                  # 30-60s window for good PM accuracy -- implemented as a
                  # feed_wdt()-safe chunked wait, never one long blocking
                  # delay (CARD-0211's watchdog-timeout lesson).
                  #
                  # STEP 8 fix (2026-09-09, real bug found bench-testing on
                  # battery alone): the whole warm-up/read/publish sequence
                  # below used to sit as a SIBLING of this if-block (same
                  # indentation), not nested inside its then: -- meaning it
                  # ran unconditionally every cycle regardless of the
                  # battery gate, defeating the cutoff entirely except for
                  # the mode-switch command itself. Everything through the
                  # final RHT-only revert now lives inside this one gate.
                  #
                  # Bug found live 2026-09-09, wiring.md vs. firmware mismatch:
                  # wiring.md's Intent Switch Wiring section documents the
                  # switch as signaling "actively collecting field data" when
                  # ON -- but this block never actually checked it, so the
                  # device duty-cycled and buffered data unconditionally
                  # regardless of Intent, contradicting the documented design
                  # (a device sitting idle with Intent off would still burn
                  # battery running the full Measurement-mode cycle). Added
                  # id(intent_switch).state here so data collection now
                  # genuinely requires Intent ON, matching wiring.md.
                  - logger.log:
                      format: "DUTY CYCLE: switching to Measurement mode, 40s warm-up starting"
                      level: WARN
                  - lambda: 'id(sen55).write_command((uint16_t) 0x0021);'  # SEN5X_CMD_START_MEASUREMENTS
                  - repeat:
                      count: 40
                      then:
                        - delay: 1s
                        - lambda: 'App.feed_wdt();'
                  # STEP 8 fix: stamp BEFORE requesting the read, so the
                  # freshness check below can prove a real publish happened
                  # after this point -- a CRC failure leaves
                  # sen55_pm25.state at its last successful value, which a
                  # plain isnan() check can't distinguish from a genuine
                  # fresh read.
                  - lambda: 'id(duty_cycle_read_start_ms) = millis();'
                  - component.update: sen55
                  # Short bounded settle wait -- waits for a genuinely
                  # fresh publish (see fix above), not just "state is
                  # currently non-NaN."
                  - lambda: 'id(pm25_wait_start) = millis();'
                  - while:
                      condition:
                        lambda: |-
                          return id(sen55_last_update_ms) < id(duty_cycle_read_start_ms) &&
                                 (millis() - id(pm25_wait_start)) < 5000;
                      then:
                        - delay: 250ms
                  - component.update: battery_voltage
                  - lambda: |-
                      float pm1  = id(sen55_pm1).state;
                      float pm25 = id(sen55_pm25).state;
                      float pm4  = id(sen55_pm4).state;
                      float pm10 = id(sen55_pm10).state;
                      float voc  = id(sen55_voc).state;
                      float nox  = id(sen55_nox).state;
                      float temp = id(sen55_temp).state;
                      float hum  = id(sen55_humidity).state;
                      float batt = id(battery_voltage).state;

                      // Build ISO 8601 UTC timestamp from the NTP-synced
                      // clock, same pattern as hiking-monitor. CARD-0343
                      // (2026-09-26): a reading taken with NO valid clock is
                      // no longer thrown away -- the first real field run
                      // lost all 98 cycles of a hike to a cold boot with no
                      // sync. It is buffered with "ts":null plus the seconds
                      // since boot and a per-boot id, so the data survives
                      // and can be given a real time later (exactly, at the
                      // dock, if this is still the same boot -- see the
                      // replay callback below).
                      ESPTime now = id(sntp_time).now();
                      bool clock_ok = now.is_valid();
                      bool reading_is_fresh = id(sen55_last_update_ms) >= id(duty_cycle_read_start_ms);

                      if (!reading_is_fresh) {
                        // STEP 8 fix: the read attempt never produced a
                        // genuine new publish this cycle (most likely a
                        // CRC failure) -- pm25/temp/hum below may be
                        // non-NaN but are stale leftovers from an earlier
                        // successful cycle.
                        ESP_LOGW("DutyCycle", "Skipped -- no fresh SEN55 publish this cycle (stale/CRC failure)");
                      } else if (isnan(pm25) || isnan(temp) || isnan(hum)) {
                        ESP_LOGW("DutyCycle", "Skipped -- pm25=%.1f temp=%.1f hum=%.1f (NaN present)", pm25, temp, hum);
                      } else {
                        char ts_field[72];
                        if (clock_ok) {
                          time_t epoch = (time_t)now.timestamp;
                          struct tm utc_tm;
                          gmtime_r(&epoch, &utc_tm);
                          char ts[25];
                          strftime(ts, sizeof(ts), "%Y-%m-%dT%H:%M:%SZ", &utc_tm);
                          snprintf(ts_field, sizeof(ts_field), "\"ts\":\"%s\"", ts);
                        } else {
                          if (id(boot_id) == 0) id(boot_id) = esp_random() | 1u;
                          snprintf(ts_field, sizeof(ts_field), "\"ts\":null,\"uptime_s\":%u,\"boot\":\"%08x\"",
                                   (unsigned)(millis() / 1000), (unsigned)id(boot_id));
                          ESP_LOGW("DutyCycle", "Clock not synced -- buffering uptime-tagged reading (%s)", ts_field);
                        }

                        char pm1_s[16], pm25_s[16], pm4_s[16], pm10_s[16], voc_s[16], nox_s[16];
                        if (isnan(pm1))  strcpy(pm1_s, "null");  else snprintf(pm1_s, sizeof(pm1_s), "%.1f", pm1);
                        snprintf(pm25_s, sizeof(pm25_s), "%.1f", pm25);
                        if (isnan(pm4))  strcpy(pm4_s, "null");  else snprintf(pm4_s, sizeof(pm4_s), "%.1f", pm4);
                        if (isnan(pm10)) strcpy(pm10_s, "null"); else snprintf(pm10_s, sizeof(pm10_s), "%.1f", pm10);
                        if (isnan(voc))  strcpy(voc_s, "null");  else snprintf(voc_s, sizeof(voc_s), "%.0f", voc);
                        if (isnan(nox))  strcpy(nox_s, "null");  else snprintf(nox_s, sizeof(nox_s), "%.0f", nox);

                        // CARD-0377 Phase 2: WiFi is normally off between upload
                        // attempts, so wifi_rssi's last polled value is almost
                        // always stale/0 here -- informational only, not gated on
                        // a live connection the way it used to be.
                        int rssi = isnan(id(wifi_rssi).state) ? 0 : (int)id(wifi_rssi).state;
                        char batt_s[16];
                        if (isnan(batt)) strcpy(batt_s, "null"); else snprintf(batt_s, sizeof(batt_s), "%.2f", batt);

                        char payload[460];
                        snprintf(payload, sizeof(payload),
                          "{\"component\":\"air-quality-monitor\","
                          "%s,"
                          "\"lat\":null,\"lon\":null,"
                          "\"temp_f\":%.1f,"
                          "\"humidity_pct\":%.1f,"
                          "\"pm1_ug_m3\":%s,"
                          "\"pm25_ug_m3\":%s,"
                          "\"pm4_ug_m3\":%s,"
                          "\"pm10_ug_m3\":%s,"
                          "\"voc_index\":%s,"
                          "\"nox_index\":%s,"
                          "\"battery_v\":%s,"
                          "\"rssi_dbm\":%d}",
                          ts_field, temp, hum, pm1_s, pm25_s, pm4_s, pm10_s, voc_s, nox_s, batt_s, rssi);

                        // CARD-0377 Phase 2: no more live-publish branch -- MQTT
                        // is gone, and even on a cycle where WiFi happens to be
                        // up there's no persistent connection to publish over.
                        // Every reading is buffered and goes out on the next
                        // eligible tick's one-shot upload, clock-resolved or not.
                        aqm_log_write(std::string(payload));
                        ESP_LOGW("DutyCycle", "Buffered to flash: %s", payload);
                      }
                  # Back to RHT/Gas-Only until the next cycle.
                  - lambda: 'id(sen55).write_command((uint16_t) 0x0037);'  # SEN5X_CMD_START_MEASUREMENTS_RHT_ONLY
                  - logger.log:
                      format: "DUTY CYCLE: back to RHT-only mode until next tick"
                      level: WARN

# CARD-0377 Phase 2: no heartbeat interval -- it could only ever fire while
# connected (docked + MQTT up), and the 2026-10-01 hike produced four false
# "silent for N hours" alerts from exactly that gap (heartbeat stops the
# moment Intent goes on and the device heads out, which looks indistinguishable
# from a crash until the device docks again). Buffered duty-cycle data moving
# and a confirmed upload at the next dock is the real liveness signal now;
# see this file's top-of-file architecture comment for the full rationale.
