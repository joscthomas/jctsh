# JCTsh Air Quality Monitor — ESPHome Configuration
# Hardware: ESP32 DevKitC-32 (38-pin, CP2102 USB-C)
#           + Sensirion SEN55 (I2C 0x69, via Adafruit #5964 adapter) — PM1.0/2.5/4.0/10, VOC, NOx
#             SEN55 is hard-wired always-on whenever the device has power (see
#             Step 6 decision below) — no dedicated power-gate transistor.
#           + RGB LED (KY-016) — GPIO18/19/23 (pins 30/31/37). PM2.5 threshold
#             indicator (Red/Green combos) + boot self-test/init sequence +
#             brief per-reading blink (Step 5). Blue is dedicated entirely to
#             networking-status diagnostics (Step 8) — see the WiFi Gate
#             Diagnostics section below.
#           + Dock detect: TP4056 IN+ (or solar) → 68kΩ+100kΩ divider → GPIO32 (pin 7)
#           + Battery voltage divider → GPIO34 (pin 5, input-only)
#           + Intent switch: repurposed SS12D10 slide switch → GPIO27 (pin 11),
#             INPUT_PULLUP + inverted (CARD-0218, Step 8) — state TRUE = switch
#             closed = actively collecting field data, same semantic as
#             hiking-monitor's own slide_switch.
#           + EEMB 1100mAh LiPo + TP4056 (charging only) + Pololu D24V10F3 buck-
#             boost regulator (CARD-0198, replaces the original MCP1700 LDO) +
#             inline power switch (BK-1208, gates only the Pololu's VIN — see
#             wiring.md's "Inline Power Switch" section for the shared-node
#             topology and why it does NOT isolate TP4056's own charge path)
#
# STEP 8 (2026-09-09): field/home mode duty-cycle + WiFi replay firmware.
# Three independent signals gate any WiFi attempt (JCTsh-Build-Standards.md
# §2.14 points 11-13) — Intent off AND Power Connected AND battery >= the
# upload-safe margin (3.8V, provisional — see CARD-0012). None of these
# signals ever stand in for another. Field-mode duty-cycle logging (SEN55
# I2C mode-switching, Measurement <-> RHT/Gas-Only) runs UNCONDITIONALLY,
# independent of dock-detect state — a deliberate deviation from
# hiking-monitor's pattern (which stops field logging the instant dock-detect
# goes HIGH), because solar/field-USB charging can happen mid-collection on
# this device just as easily as at home.
#
# STEP 6 DECISION (2026-08-21): no dedicated SEN55 power-gate transistor.
# Sensirion's own "Reduced Power Operation for SEN5x" doc recommends I2C
# mode-switching (Measurement ↔ RHT/Gas-Only) as the primary duty-cycle
# power-saving mechanism, not physically cutting power — and the existing
# inline power switch (battery+ path, Step 1) already covers true full-off
# for storage/transport. SEN55 stays hard-wired to the common ground rail.
#
# GPIO assignments (ESP32-project-pins.md has the full 38-pin table):
#   GPIO21  I2C SDA (SEN55 via Adafruit adapter) — blue
#   GPIO22  I2C SCL — yellow
#   GPIO27  Intent switch (pin 11, CARD-0218/Step 8) — INPUT_PULLUP, inverted
#   GPIO17  Debug UART2 TX (CARD-0205, 2026-08-24) — external CP2102 adapter,
#           transmit-only. ESP32's fixed UART2 TX pin (not remappable via
#           ESPHome's logger component — see logger: block below)
#   GPIO32  Dock detect (TP4056 IN+ or solar → divider, HIGH = docked/charging)
#   GPIO34  Battery voltage ADC (100kΩ/100kΩ divider, post-switch node — wiring.md)
#
# MQTT topics (prefix: jctsh/components/air-quality-monitor):
#   .../data       — sensor readings, Environmental Data schema (Step 8)
#   .../log        — diagnostic messages (JSON, wildcard routed to Python log server)
#   .../heartbeat  — 5-min heartbeat when MQTT connected (matches hiking-monitor's
#                    established deviation from the generic 30-min standard, Step 0)

esphome:
  name: air-quality-monitor
  friendly_name: Air Quality Monitor
  includes:
    - aqm_logger.h
  on_boot:
    - priority: -100.0
      then:
        # Workaround for a confirmed ESPHome bug (found in minimal-test.yaml,
        # 2026-08-28): logger_esp32.cpp calls uart_param_config()/
        # uart_driver_install() for hardware_uart: UART2 but never
        # uart_set_pin() -- the peripheral runs but is never actually routed
        # through the GPIO matrix to GPIO17, so nothing reaches the external
        # debug adapter without this manual call. Must run before anything
        # else logs, so as much of the boot sequence as possible is captured.
        - lambda: |-
            uart_set_pin(UART_NUM_2, GPIO_NUM_17, UART_PIN_NO_CHANGE, UART_PIN_NO_CHANGE, UART_PIN_NO_CHANGE);
        # ── STEP 8: WiFi attempt gate, checked FIRST — before anything else ──
        # ESPHome's wifi: component tries to associate automatically and
        # unconditionally during its own setup() -- nothing stops it by
        # default (the exact latent gap CARD-0217 found and fixed on
        # hiking-monitor). This device's on_boot block is priority -100,
        # which is LOWER than WiFi's fixed setup_priority of 250 -- lower
        # priority numbers run LATER, so WiFi's setup() has *already
        # completed* by the time this block runs (confirmed by checking the
        # actual ordering, not copied from hiking-monitor blind -- that
        # device's equivalent block is priority 600, which runs BEFORE
        # WiFi's setup, forcing it to defer the disable call to the first
        # interval tick instead). Because of that difference, this device
        # can call wifi.disable() directly, right here, within milliseconds
        # of boot -- not after the ~60-80s the SEN55/LED sequence below
        # would otherwise take if the gate check waited until after it.
        - component.update: battery_voltage
        - if:
            condition:
              and:
                - binary_sensor.is_off: intent_switch
                - binary_sensor.is_on: dock_detect
            then:
              # Intent off + Power Connected -- the two conditions that would
              # otherwise mean "try WiFi." Battery is the deciding factor.
              - if:
                  condition:
                    lambda: 'return isnan(id(battery_voltage).state) || id(battery_voltage).state < 3.8f;'
                  then:
                    # Voltage-blocked: the one new LED diagnostic worth the
                    # cost of a boot-time blink (2026-09-09 design decision)
                    # -- distinguishes "docked and ready, but deliberately
                    # not trying" from "no network in range," which look
                    # identical without this. ~1.8s total.
                    - repeat:
                        count: 3
                        then:
                          - output.turn_on: rgb_led_blue
                          - output.turn_on: rgb_led_red
                          - delay: 300ms
                          - output.turn_off: rgb_led_blue
                          - output.turn_off: rgb_led_red
                          - delay: 300ms
                    - wifi.disable:
                    - lambda: |-
                        id(wifi_attempt_in_progress) = false;
                        char buf[128];
                        snprintf(buf, sizeof(buf),
                          "{\"event\":\"wifi_attempt_blocked\",\"battery_v\":%.2f}",
                          id(battery_voltage).state);
                        aqm_log_write(std::string(buf));
                  else:
                    # Gate fully true -- WiFi's own already-running boot
                    # attempt is left alone; adopt it into our own tracking
                    # rather than calling wifi.enable() again (harmless but
                    # redundant, since ESPHome's own setup() already started
                    # it before we could intervene).
                    - lambda: |-
                        id(wifi_attempt_in_progress) = true;
                        id(wifi_attempt_start_ms) = millis();
                        aqm_log_write("{\"event\":\"wifi_attempt_start\"}");
            else:
              # Intent on, or Power not connected -- the common/expected
              # case (actively out collecting, or just sitting unplugged).
              # No LED for this one (2026-09-09 decision: low diagnostic
              # value against a blink on every single boot).
              - wifi.disable:
              - lambda: 'id(wifi_attempt_in_progress) = false;'
        # ── Existing SEN55/reset-reason/self-test sequence (Steps 4-6), unchanged ──
        # Force SEN55 into Idle mode (~2.6mA) — moved ahead of the
        # reset-reason LED block, 2026-08-24, after live testing showed the
        # original ordering still left SEN55 running full ~63mA Measurement
        # mode (auto-started by its own sen5x platform setup(), priority
        # ~600, well before this script's priority -100.0) through the
        # entire reset-reason LED delay before ever being told to idle down.
        - lambda: 'id(sen55).write_command((uint16_t) 0x3f86);'  # SEN5X_CMD_STOP_MEASUREMENTS -> Idle mode
        # Reset-reason LED signal — added 2026-08-21. Live serial isn't safe
        # on battery power; MQTT-based reporting only works if the device
        # gets far enough to connect. The LED has no such dependency.
        - if:
            condition:
              lambda: |-
                std::string reason = id(reset_reason_text).state;
                return reason.find("rownout") != std::string::npos ||
                       reason.find("glitch") != std::string::npos;
            then:
              - output.turn_on: rgb_led_red
              - delay: 3s
              - output.turn_off: rgb_led_red
            else:
              - output.turn_on: rgb_led_blue
              - delay: 1s
              - output.turn_off: rgb_led_blue
        # Boot self-test LED sequence: two quick blinks per color (Blue, Red,
        # Yellow, Green), then blink Green with NO timeout until SEN55
        # produces a first valid PM2.5 reading.
        - repeat:
            count: 2
            then:
              - output.turn_on: rgb_led_blue
              - delay: 300ms
              - output.turn_off: rgb_led_blue
              - delay: 300ms
        - repeat:
            count: 2
            then:
              - output.turn_on: rgb_led_red
              - delay: 300ms
              - output.turn_off: rgb_led_red
              - delay: 300ms
        - repeat:
            count: 2
            then:
              - output.turn_on: rgb_led_red
              - output.turn_on: rgb_led_green
              - delay: 300ms
              - output.turn_off: rgb_led_red
              - output.turn_off: rgb_led_green
              - delay: 300ms
        - repeat:
            count: 2
            then:
              - output.turn_on: rgb_led_green
              - delay: 300ms
              - output.turn_off: rgb_led_green
              - delay: 300ms
        - delay: 1s
        # STEP 8: this bounded wait only runs when a WiFi attempt is
        # genuinely in progress (gate was true above) -- when the gate is
        # false, WiFi has already been disabled and will never connect, so
        # waiting the full 30s here would be pure waste. Also drives the
        # "actively attempting" LED pattern (slow blue blink) for the same
        # duration -- starts here, roughly 7-10s after power-on, once the
        # reset-reason + self-test sequence above has run.
        - if:
            condition:
              lambda: 'return id(wifi_attempt_in_progress);'
            then:
              - lambda: 'id(boot_wait_start) = millis();'
              - while:
                  condition:
                    lambda: |-
                      return !id(mqtt_client).is_connected() &&
                             (millis() - id(boot_wait_start)) < 30000;
                  then:
                    - output.turn_on: rgb_led_blue
                    - delay: 500ms
                    - output.turn_off: rgb_led_blue
                    - delay: 500ms
              # Window is over -- either connected (on_connect will fire its
              # own "connected" log/LED separately) or it timed out.
              - if:
                  condition:
                    lambda: 'return !id(mqtt_client).is_connected();'
                  then:
                    - repeat:
                        count: 2
                        then:
                          - output.turn_on: rgb_led_blue
                          - delay: 200ms
                          - output.turn_off: rgb_led_blue
                          - delay: 200ms
                    - wifi.disable:
                    - lambda: |-
                        id(wifi_attempt_in_progress) = false;
                        id(wifi_last_attempt_end_ms) = millis();
                        aqm_log_write("{\"event\":\"wifi_attempt_timeout\"}");
        # Resume full Measurement mode for one real boot-time reading (proves
        # the sensor works, drives the self-test's "wait for first valid
        # reading" below) -- the ongoing duty-cycle interval takes over from
        # here once this boot sequence hands off (see the RHT-only command
        # at the very end of this block).
        - lambda: 'id(sen55).write_command((uint16_t) 0x0021);'  # SEN5X_CMD_START_MEASUREMENTS
        - delay: 2s   # let the SEN55 fan/sensor settle before forcing a first read
        - component.update: sen55
        - component.update: battery_voltage
        - lambda: 'id(pm25_wait_start) = millis();'
        - while:
            condition:
              lambda: |-
                return isnan(id(sen55_pm25).state) &&
                       (millis() - id(pm25_wait_start)) < 30000;
            then:
              - output.turn_on: rgb_led_green
              - delay: 400ms
              - output.turn_off: rgb_led_green
              - delay: 400ms
        - output.turn_on: rgb_led_green
        - delay: 2s
        - output.turn_off: rgb_led_green
        - lambda: 'id(boot_sequence_done) = true;'
        # Threshold-color confirmation: hold solid Yellow then solid Red for 3s each.
        - delay: 1s
        - output.turn_on: rgb_led_red
        - output.turn_on: rgb_led_green
        - delay: 3s
        - output.turn_off: rgb_led_red
        - output.turn_off: rgb_led_green
        - delay: 500ms
        - output.turn_on: rgb_led_red
        - delay: 3s
        - output.turn_off: rgb_led_red
        # STEP 8: hand off to the ongoing duty cycle -- drop to RHT/Gas-Only
        # mode now; the 2-min interval below brings it back to Measurement
        # mode briefly each cycle.
        - lambda: 'id(sen55).write_command((uint16_t) 0x0037);'  # SEN5X_CMD_START_MEASUREMENTS_RHT_ONLY
        - lambda: 'aqm_log_begin();'

esp32:
  board: esp32dev
  framework:
    type: arduino

# ── Debug / reset reason ──────────────────────────────────────────────────────
debug:

# ── Globals ───────────────────────────────────────────────────────────────────
globals:
  # Gates the pm_2_5 on_value LED handler below so it doesn't fight the boot
  # self-test animation above over the same GPIO outputs.
  - id: boot_sequence_done
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: boot_wait_start
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: pm25_wait_start
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # STEP 8: WiFi attempt-window/retry state machine (JCTsh-Build-Standards.md
  # §2.14 point 13, Step 2). Checked every 2-min interval tick, not a
  # separate timer -- same precedent as CARD-0224's periodic recheck on
  # hiking-monitor.
  - id: wifi_gate_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: wifi_attempt_in_progress
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: wifi_attempt_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: wifi_last_attempt_end_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # STEP 8 / CARD-0224 pattern: set when attempt_aqm_replay defers because
  # battery was below the 3.8V upload-safe threshold, cleared once a replay
  # actually completes. Lets the periodic interval retry once voltage
  # recovers while charging, instead of depending on another on_connect
  # event that may never come if the MQTT link just stays up.
  - id: replay_deferred_pending
    type: bool
    restore_value: false
    initial_value: 'false'
  # STEP 8 fix (2026-09-09, real bug found on first bench test): a CRC
  # failure on the SEN55 I2C read leaves sensor.state at its last
  # successfully-published value rather than NaN -- an isnan() check alone
  # can't tell "genuinely fresh reading" from "stale leftover from an
  # earlier successful cycle." sen55_last_update_ms is stamped inside
  # pm_2_5's own on_value handler (fires only on an actual successful
  # publish, i.e. only when the CRC check passed); the duty-cycle interval
  # stamps duty_cycle_read_start_ms right before asking for a new read, and
  # only trusts the reading if the former is >= the latter -- proof a real
  # publish happened *after* this cycle's own read request, not before it.
  - id: sen55_last_update_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: duty_cycle_read_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

# ── WiFi ──────────────────────────────────────────────────────────────────────
# Multi-network (portable component): home WiFi first, Pixel hotspot second.
# `ap:` fallback included (standard default per JCTsh-Build-Standards.md
# §2.8) -- the known ESPHome #7222 reboot_timeout/wifi.ap: interaction
# (CARD-0045) is moot here: this firmware manages WiFi enable/disable itself
# via the gate/attempt-window state machine above and never relies on
# ESPHome's own built-in reboot-on-disconnect mechanism.
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret hotspot_ssid
      password: !secret hotspot_password
  ap:
    ssid: "air-quality-monitor-fallback"
    password: !secret ap_password
  # CARD-0253 (2026-09-09): use the LAN-local broker whenever actually on
  # the home network, DuckDNS only otherwise (field/hotspot) -- avoids
  # needlessly routing a same-LAN connection out to the internet and back,
  # which real testing found causes sustained DNS-resolution failures.
  # Hardcoded "JCTnet1" (not !secret wifi_ssid -- a compile-time secret
  # can't be referenced inside a lambda string literal) must match the
  # wifi_ssid secret's actual value.
  on_connect:
    - lambda: |-
        if (id(wifi_ssid_sensor).state == "JCTnet1") {
          id(mqtt_client).set_broker_address("pi1.local");
        } else {
          id(mqtt_client).set_broker_address("jctsh.duckdns.org");
        }

captive_portal:

# ── Logging ───────────────────────────────────────────────────────────────────
logger:
  level: INFO
  hardware_uart: UART2  # CARD-0205 secondary debug UART -- external CP2102 adapter, GPIO17

# ── OTA updates ───────────────────────────────────────────────────────────────
# First flash: USB from C:\esphome\air-quality-monitor\
# All subsequent updates: OTA — esphome run air-quality-monitor.yaml
ota:
  - platform: esphome
    password: !secret ota_password

# ── NTP time sync ─────────────────────────────────────────────────────────────
# No RTC hardware. Timestamps for buffered field-mode readings are built from
# this clock — matches hiking-monitor's exact pattern (`sntp_time`, same
# timezone/servers).
time:
  - platform: sntp
    id: sntp_time
    timezone: America/Phoenix
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org

# ── MQTT ──────────────────────────────────────────────────────────────────────
mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: 8883
  certificate_authority: !secret mqtt_ca_cert
  # CARD-0253 (2026-09-09): TLS stays on for both the home-LAN and field
  # paths -- ESPHome's MQTT backend only decides TLS-vs-plaintext transport
  # once, at the client's first initialize_() call (confirmed by reading the
  # installed esphome package's own mqtt_backend_esp32.cpp source), so
  # switching that at runtime isn't safely supported. Switching only the
  # broker *hostname* at runtime (see wifi: on_connect: below) is well-
  # supported (mqtt_client.cpp's start_connect_() reads credentials_.address
  # fresh on every connection attempt). Mosquitto's 8883 TLS listener has no
  # bind-address restriction (confirmed directly in mosquitto.conf), so it's
  # reachable via pi1.local on the LAN too, not just jctsh.duckdns.org -- but
  # its cert's CN/SAN only covers jctsh.duckdns.org, so a straight hostname
  # swap would fail cert validation without this:
  skip_cert_cn_check: true
  idf_send_async: false  # ESPHome-recommended stability setting for MQTT+TLS on esp-idf
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: jctsh/components/air-quality-monitor
  discovery: false  # no Home Assistant integration (Phase 3 decision) — do not leave at ESPHome's true default
  will_message:
    topic: jctsh/components/air-quality-monitor/log
    payload: '{"component":"air-quality-monitor","category":"MQTT","message":"MQTT disconnected"}'
    retain: false
    qos: 0
  on_connect:
    - delay: 500ms
    - mqtt.publish:
        topic: jctsh/components/air-quality-monitor/log
        payload: !lambda |-
          char buf[320];
          snprintf(buf, sizeof(buf),
            "{\"component\":\"air-quality-monitor\",\"category\":\"System\","
            "\"message\":\"Air quality monitor online - ESPHome " ESPHOME_VERSION ", IP: %s, reset reason: %s\"}",
            id(wifi_ip).state.c_str(), id(reset_reason_text).state.c_str());
          return std::string(buf);
    - mqtt.publish:
        topic: jctsh/components/air-quality-monitor/log
        payload: '{"component":"air-quality-monitor","category":"MQTT","message":"MQTT connected"}'
    # STEP 8: "connected" LED (solid blue ~1s) -- the one networking-status
    # state that CAN log live, since MQTT is up by definition at this point.
    - output.turn_on: rgb_led_blue
    - delay: 1s
    - output.turn_off: rgb_led_blue
    - lambda: |-
        id(wifi_attempt_in_progress) = false;
        id(wifi_last_attempt_end_ms) = 0;  // clear backoff -- a real connection succeeded
    - script.execute: attempt_aqm_replay

# ── I2C ───────────────────────────────────────────────────────────────────────
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# ── RGB LED ───────────────────────────────────────────────────────────────────
output:
  - platform: gpio
    pin: GPIO18
    id: rgb_led_red
  - platform: gpio
    pin: GPIO19
    id: rgb_led_green
  - platform: gpio
    pin: GPIO23
    id: rgb_led_blue

# ── Replay script (STEP 8 / CARD-0224 pattern) ─────────────────────────────────
# Attempt to replay any buffered field-mode data. Defers (and records
# replay_deferred_pending) if battery is still below the 3.8V upload-safe
# threshold -- the same gate that decides whether WiFi is even allowed to try
# in the first place, checked again here as defense-in-depth since voltage
# could in principle sag between the gate passing and this actually running.
script:
  - id: attempt_aqm_replay
    then:
      - lambda: |-
          if (aqm_log_has_data()) {
            int count = aqm_log_count();
            if (count > 0) {
              if (!isnan(id(battery_voltage).state) && id(battery_voltage).state < 3.8f) {
                id(replay_deferred_pending) = true;
                char skip_buf[176];
                snprintf(skip_buf, sizeof(skip_buf),
                  "{\"component\":\"air-quality-monitor\",\"category\":\"Alert\","
                  "\"message\":\"Replay deferred - battery %.2fV below 3.8V upload threshold, waiting for charge\"}",
                  id(battery_voltage).state);
                id(mqtt_client).publish("jctsh/components/air-quality-monitor/log",
                                        std::string(skip_buf), 0, false);
              } else {
                char log_buf[128];
                snprintf(log_buf, sizeof(log_buf),
                  "{\"component\":\"air-quality-monitor\",\"category\":\"System\","
                  "\"message\":\"Replaying %d buffered readings...\"}",
                  count);
                id(mqtt_client).publish("jctsh/components/air-quality-monitor/log",
                                        std::string(log_buf), 0, false);
                aqm_log_replay_stream([](const std::string& line) {
                  id(mqtt_client).publish("jctsh/components/air-quality-monitor/data",
                                          line, 0, false);
                  App.feed_wdt();
                  delay(50);
                });
                id(mqtt_client).publish("jctsh/components/air-quality-monitor/log",
                  std::string("{\"component\":\"air-quality-monitor\",\"category\":\"System\","
                             "\"message\":\"Buffered-data replay complete.\"}"), 0, false);
                aqm_log_clear();
                id(replay_deferred_pending) = false;
              }
            }
          }

# ── Sensors ───────────────────────────────────────────────────────────────────
sensor:
  # SEN55 — native sen5x platform. update_interval matches the 2-min duty-
  # cycle tick below; the actual mode-switching (RHT-only <-> Measurement)
  # and read timing is driven explicitly from the interval, not from this
  # platform's own independent polling.
  - platform: sen5x
    id: sen55
    address: 0x69
    update_interval: 2min
    pm_1_0:
      name: "PM 1.0"
      id: sen55_pm1
      internal: true
    pm_2_5:
      name: "PM 2.5"
      id: sen55_pm25
      internal: true
      on_value:
        then:
          # STEP 8 fix: stamps on every genuine successful publish (fires
          # regardless of boot_sequence_done, unlike the LED handler below)
          # -- see sen55_last_update_ms's own comment in the globals block.
          - lambda: |-
              if (!isnan(x)) {
                id(sen55_last_update_ms) = millis();
              }
          - if:
              condition:
                lambda: 'return id(boot_sequence_done) && !isnan(x);'
              then:
                - lambda: |-
                    if (x < 12.0f) {
                      id(rgb_led_red).turn_off();
                      id(rgb_led_green).turn_on();
                      id(rgb_led_blue).turn_off();
                    } else if (x <= 35.0f) {
                      id(rgb_led_red).turn_on();
                      id(rgb_led_green).turn_on();
                      id(rgb_led_blue).turn_off();
                    } else {
                      id(rgb_led_red).turn_on();
                      id(rgb_led_green).turn_off();
                      id(rgb_led_blue).turn_off();
                    }
                - delay: 1s
                - output.turn_off: rgb_led_red
                - output.turn_off: rgb_led_green
                - output.turn_off: rgb_led_blue
    pm_4_0:
      name: "PM 4.0"
      id: sen55_pm4
      internal: true
    pm_10_0:
      name: "PM 10.0"
      id: sen55_pm10
      internal: true
    voc:
      name: "VOC Index"
      id: sen55_voc
      internal: true
    nox:
      name: "NOx Index"
      id: sen55_nox
      internal: true
    # CARD-0218: SEN55's own temperature/humidity, kept separate from
    # hiking-monitor's BME280 (source: air-quality-monitor, not a
    # duplicate) -- intended as an independent reference to compare
    # against, given this device's mounting/placement may read more
    # accurately. temperature_compensation/acceleration_mode left at
    # default deliberately (Joseph's call).
    temperature:
      name: "Temperature"
      id: sen55_temp
      internal: true
      filters:
        - lambda: return x * 9.0/5.0 + 32.0;   # C -> F, matching this project's °F convention
      unit_of_measurement: "°F"
    humidity:
      name: "Humidity"
      id: sen55_humidity
      internal: true

  # Battery voltage — voltage divider on GPIO34 (100kΩ + 100kΩ → 2:1 divider),
  # post-switch node (wiring.md, verified 2026-09-08).
  - platform: adc
    pin: GPIO34
    name: "Battery Voltage"
    id: battery_voltage
    attenuation: 12db
    update_interval: 30s
    filters:
      - multiply: 2.0
    unit_of_measurement: "V"
    accuracy_decimals: 2
    internal: true

  # Internal sensors used in on_connect/heartbeat lambdas
  - platform: uptime
    id: uptime_sec
    internal: true

  - platform: wifi_signal
    id: wifi_rssi
    internal: true
    update_interval: 60s

# ── WiFi IP (used in on_connect log message) ──────────────────────────────────
text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true
    ssid:
      id: wifi_ssid_sensor
      internal: true
  - platform: debug
    reset_reason:
      id: reset_reason_text
      internal: true

# ── Binary sensors ────────────────────────────────────────────────────────────
binary_sensor:
  # Intent switch — repurposed SS12D10 slide switch (CARD-0218, Step 8),
  # GPIO27 (pin 11), same pin/pattern as hiking-monitor's own slide_switch.
  # State TRUE = switch closed = actively collecting field data.
  - platform: gpio
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Intent Switch"
    id: intent_switch
    internal: true

  # Dock detect: TP4056 IN+ (or solar) -> 68kΩ -> midpoint -> 100kΩ -> GND;
  # midpoint to GPIO32. HIGH = docked/charging or solar connected.
  - platform: gpio
    pin:
      number: GPIO32
      mode: INPUT
    name: "Dock Detect"
    id: dock_detect
    internal: true

# ── Duty-cycle / field logging / WiFi gate interval ────────────────────────────
interval:
  - interval: 2min
    then:
      # ── STEP 8: WiFi attempt-gate state machine ──
      # Ongoing re-check of the three-condition gate, and the bounded-
      # attempt-window/15min-retry backoff (JCTsh-Build-Standards.md §2.14
      # point 13, Step 2). Runs every tick regardless of mode, same as
      # hiking-monitor's own CARD-0224 periodic recheck.
      - lambda: |-
          bool intent_off = !id(intent_switch).state;
          bool power_connected = id(dock_detect).state;
          bool voltage_ok = !isnan(id(battery_voltage).state) && id(battery_voltage).state >= 3.8f;
          id(wifi_gate_ok) = intent_off && power_connected && voltage_ok;

          if (!id(wifi_gate_ok)) {
            id(wifi_attempt_in_progress) = false;
          } else if (!id(mqtt_client).is_connected()) {
            if (!id(wifi_attempt_in_progress)) {
              bool never_attempted = (id(wifi_last_attempt_end_ms) == 0);
              uint32_t since_last = millis() - id(wifi_last_attempt_end_ms);
              if (never_attempted || since_last >= (15UL * 60UL * 1000UL)) {
                id(wifi_attempt_in_progress) = true;
                id(wifi_attempt_start_ms) = millis();
                aqm_log_write("{\"event\":\"wifi_attempt_start\"}");
              }
            } else if (millis() - id(wifi_attempt_start_ms) >= (2UL * 60UL * 1000UL)) {
              // Attempt window elapsed with no connection -- give up for now.
              id(wifi_attempt_in_progress) = false;
              id(wifi_last_attempt_end_ms) = millis();
              aqm_log_write("{\"event\":\"wifi_attempt_timeout\"}");
            }
          }
          // Gate true + MQTT already connected: nothing to do here, on_connect owns it.
      - if:
          condition:
            lambda: 'return !id(wifi_gate_ok);'
          then:
            - wifi.disable:
          else:
            - if:
                condition:
                  and:
                    - lambda: 'return id(wifi_attempt_in_progress);'
                    - lambda: 'return !id(mqtt_client).is_connected();'
                then:
                  - wifi.enable:
      # CARD-0224 pattern: on_connect only fires once per connection event --
      # if the MQTT link stays persistently up after a replay was deferred
      # for low battery, nothing else re-triggers a retry once voltage
      # recovers while charging.
      - if:
          condition:
            lambda: |-
              return id(mqtt_client).is_connected()
                  && id(replay_deferred_pending)
                  && !isnan(id(battery_voltage).state)
                  && id(battery_voltage).state >= 3.8f
                  && aqm_log_has_data();
          then:
            - script.execute: attempt_aqm_replay

      # ── STEP 8: SEN55 duty-cycle -- warm up, read, drop back to RHT-only ──
      # STEP 8 fix (2026-09-09, real race condition found on first bench
      # test): on_boot's own YAML-level delay:/while: actions are
      # non-blocking automations, not a single blocking script -- loop()
      # (and therefore this interval) can start running *while on_boot is
      # still mid-sequence*. Without this gate, on_boot's own SEN55
      # write_command calls (Idle -> Measurement -> RHT-only) and this
      # block's calls can genuinely race on the same I2C bus -- almost
      # certainly the real cause of CARD-0252's CRC failures, not a hardware
      # flake as first assumed. Confirmed directly: the very first tick fired
      # only 4.5s after "setup() finished successfully," far too early for
      # on_boot's reset-reason-check + 8-blink self-test + bounded MQTT wait
      # to have actually completed. Skip this whole block entirely until
      # on_boot's own sequence has genuinely finished.
      - if:
          condition:
            lambda: 'return id(boot_sequence_done);'
          then:
            # Idle in RHT/Gas-Only mode between cycles (set at the end of
            # on_boot and again at the end of this block). ~40s warm-up
            # before reading, within Sensirion's recommended 30-60s window
            # for good PM accuracy -- implemented as a feed_wdt()-safe
            # chunked wait, never one long blocking delay (CARD-0211's
            # watchdog-timeout lesson).
            - logger.log:
                format: "DUTY CYCLE: switching to Measurement mode, 40s warm-up starting"
                level: WARN
            - lambda: 'id(sen55).write_command((uint16_t) 0x0021);'  # SEN5X_CMD_START_MEASUREMENTS
            - repeat:
                count: 40
                then:
                  - delay: 1s
                  - lambda: 'App.feed_wdt();'
            # STEP 8 fix: stamp BEFORE requesting the read, so the freshness
            # check below can prove a real publish happened after this point
            # -- a CRC failure leaves sen55_pm25.state at its last
            # successful value, which a plain isnan() check can't
            # distinguish from a genuine fresh read.
            - lambda: 'id(duty_cycle_read_start_ms) = millis();'
            - component.update: sen55
            # Short bounded settle wait -- waits for a genuinely fresh
            # publish (see fix above), not just "state is currently
            # non-NaN."
            - lambda: 'id(pm25_wait_start) = millis();'
            - while:
                condition:
                  lambda: |-
                    return id(sen55_last_update_ms) < id(duty_cycle_read_start_ms) &&
                           (millis() - id(pm25_wait_start)) < 5000;
                then:
                  - delay: 250ms
            - component.update: battery_voltage
            - lambda: |-
                float pm1  = id(sen55_pm1).state;
                float pm25 = id(sen55_pm25).state;
                float pm4  = id(sen55_pm4).state;
                float pm10 = id(sen55_pm10).state;
                float voc  = id(sen55_voc).state;
                float nox  = id(sen55_nox).state;
                float temp = id(sen55_temp).state;
                float hum  = id(sen55_humidity).state;
                float batt = id(battery_voltage).state;

                // Build ISO 8601 UTC timestamp from the NTP-synced clock,
                // same pattern as hiking-monitor -- skip (buffered) if not
                // yet synced.
                ESPTime now = id(sntp_time).now();
                bool reading_is_fresh = id(sen55_last_update_ms) >= id(duty_cycle_read_start_ms);

                if (!now.is_valid()) {
                  aqm_log_write("{\"event\":\"skip\",\"reason\":\"clock_invalid\"}");
                  ESP_LOGW("DutyCycle", "Skipped -- clock not yet synced (expected with WiFi off)");
                } else if (!reading_is_fresh) {
                  // STEP 8 fix: the read attempt never produced a genuine
                  // new publish this cycle (most likely a CRC failure) --
                  // pm25/temp/hum below may be non-NaN but are stale
                  // leftovers from an earlier successful cycle.
                  aqm_log_write("{\"event\":\"skip\",\"reason\":\"sensor_stale\"}");
                  ESP_LOGW("DutyCycle", "Skipped -- no fresh SEN55 publish this cycle (stale/CRC failure)");
                } else if (isnan(pm25) || isnan(temp) || isnan(hum)) {
                  aqm_log_write("{\"event\":\"skip\",\"reason\":\"nan_sensor\"}");
                  ESP_LOGW("DutyCycle", "Skipped -- pm25=%.1f temp=%.1f hum=%.1f (NaN present)", pm25, temp, hum);
                } else {
                  time_t epoch = (time_t)now.timestamp;
                  struct tm utc_tm;
                  gmtime_r(&epoch, &utc_tm);
                  char ts[25];
                  strftime(ts, sizeof(ts), "%Y-%m-%dT%H:%M:%SZ", &utc_tm);

                  char pm1_s[16], pm25_s[16], pm4_s[16], pm10_s[16], voc_s[16], nox_s[16];
                  if (isnan(pm1))  strcpy(pm1_s, "null");  else snprintf(pm1_s, sizeof(pm1_s), "%.1f", pm1);
                  snprintf(pm25_s, sizeof(pm25_s), "%.1f", pm25);
                  if (isnan(pm4))  strcpy(pm4_s, "null");  else snprintf(pm4_s, sizeof(pm4_s), "%.1f", pm4);
                  if (isnan(pm10)) strcpy(pm10_s, "null"); else snprintf(pm10_s, sizeof(pm10_s), "%.1f", pm10);
                  if (isnan(voc))  strcpy(voc_s, "null");  else snprintf(voc_s, sizeof(voc_s), "%.0f", voc);
                  if (isnan(nox))  strcpy(nox_s, "null");  else snprintf(nox_s, sizeof(nox_s), "%.0f", nox);

                  int rssi = id(mqtt_client).is_connected() ? (int)id(wifi_rssi).state : 0;
                  char batt_s[16];
                  if (isnan(batt)) strcpy(batt_s, "null"); else snprintf(batt_s, sizeof(batt_s), "%.2f", batt);

                  char payload[400];
                  snprintf(payload, sizeof(payload),
                    "{\"component\":\"air-quality-monitor\","
                    "\"ts\":\"%s\","
                    "\"lat\":null,\"lon\":null,"
                    "\"temp_f\":%.1f,"
                    "\"humidity_pct\":%.1f,"
                    "\"pm1_ug_m3\":%s,"
                    "\"pm25_ug_m3\":%s,"
                    "\"pm4_ug_m3\":%s,"
                    "\"pm10_ug_m3\":%s,"
                    "\"voc_index\":%s,"
                    "\"nox_index\":%s,"
                    "\"battery_v\":%s,"
                    "\"rssi_dbm\":%d}",
                    ts, temp, hum, pm1_s, pm25_s, pm4_s, pm10_s, voc_s, nox_s, batt_s, rssi);

                  if (id(mqtt_client).is_connected()) {
                    id(mqtt_client).publish("jctsh/components/air-quality-monitor/data",
                                            std::string(payload), 0, false);
                    ESP_LOGW("DutyCycle", "Published live: %s", payload);
                  } else {
                    aqm_log_write(std::string(payload));
                    ESP_LOGW("DutyCycle", "Buffered to flash: %s", payload);
                  }
                }
            # Back to RHT/Gas-Only until the next cycle.
            - lambda: 'id(sen55).write_command((uint16_t) 0x0037);'  # SEN5X_CMD_START_MEASUREMENTS_RHT_ONLY
            - logger.log:
                format: "DUTY CYCLE: back to RHT-only mode until next tick"
                level: WARN

  # 5-minute heartbeat — matches hiking-monitor's established deviation from
  # the generic 30-min standard. Home mode only (mqtt_client.is_connected()).
  - interval: 5min
    then:
      - if:
          condition:
            lambda: 'return id(mqtt_client).is_connected();'
          then:
            - mqtt.publish:
                topic: jctsh/components/air-quality-monitor/log
                payload: !lambda |-
                  uint32_t secs = (uint32_t)id(uptime_sec).state;
                  uint32_t h = secs / 3600;
                  uint32_t m = (secs % 3600) / 60;
                  int rssi = (int)id(wifi_rssi).state;
                  float pm25 = id(sen55_pm25).state;
                  float voc  = id(sen55_voc).state;
                  float nox  = id(sen55_nox).state;
                  float batt = id(battery_voltage).state;
                  char pm25_str[16], voc_str[16], nox_str[16], batt_str[16];
                  if (isnan(pm25)) strcpy(pm25_str, "unavailable");
                  else snprintf(pm25_str, sizeof(pm25_str), "%.1f", pm25);
                  if (isnan(voc)) strcpy(voc_str, "unavailable");
                  else snprintf(voc_str, sizeof(voc_str), "%.0f", voc);
                  if (isnan(nox)) strcpy(nox_str, "unavailable");
                  else snprintf(nox_str, sizeof(nox_str), "%.0f", nox);
                  if (isnan(batt)) strcpy(batt_str, "unavailable");
                  else snprintf(batt_str, sizeof(batt_str), "%.2fV", batt);
                  char buf[320];
                  snprintf(buf, sizeof(buf),
                    "{\"component\":\"air-quality-monitor\",\"category\":\"System\","
                    "\"message\":\"Heartbeat - uptime: %uh %um, RSSI: %ddBm, PM2.5: %s, VOC: %s, NOx: %s, batt: %s\"}",
                    h, m, rssi, pm25_str, voc_str, nox_str, batt_str);
                  return std::string(buf);
            - mqtt.publish:
                topic: jctsh/components/air-quality-monitor/heartbeat
                payload: !lambda |-
                  uint32_t secs = (uint32_t)id(uptime_sec).state;
                  uint32_t h = secs / 3600;
                  uint32_t m = (secs % 3600) / 60;
                  int rssi = (int)id(wifi_rssi).state;
                  float batt = id(battery_voltage).state;
                  char batt_json[16];
                  if (isnan(batt)) strcpy(batt_json, "null");
                  else snprintf(batt_json, sizeof(batt_json), "%.2f", batt);
                  char buf[160];
                  snprintf(buf, sizeof(buf),
                    "{\"component\":\"air-quality-monitor\",\"uptime\":\"%uh %um\",\"rssi\":%d,\"battery_v\":%s}",
                    h, m, rssi, batt_json);
                  return std::string(buf);
