# Minimal incremental test build (2026-08-24) — CARD-0198 battery-boot
# investigation. Starts bare (boot + LED blink only) and adds one subsystem
# at a time (WiFi, MQTT, debug UART, I2C, SEN55) to isolate which piece
# introduces battery-boot instability. NOT the real component firmware —
# a standalone diagnostic build, kept in the repo so this test sequence
# survives past one session. Flash from C:\esphome\air-quality-monitor\
# (copy this file there first) same as the real component, per
# feedback_esphome_flash_path. See CARD-0198 in tos/kanban-board.md for
# the full narrative, current stage, and results at each stage.
#
# CORRECTION, 2026-08-29 -- every Stage 1 (+WiFi) trial run so far tested
# a scenario the real firmware can never actually produce. Per
# JCTsh-Build-Standards.md §2.14 point 13: WiFi only ever enables when
# Intent is off AND Power Connected is true (both required) -- but every
# trial ran on pure battery, USB unplugged from both the ESP32's own port
# and TP4056's charging port, Power Connected false throughout. This
# file's wifi: block connects unconditionally with none of that gating
# logic implemented, so it's a narrower question ("can this power path
# survive WiFi's current draw at all") than a simulation of real behavior.
# The brownout finding is probably still valid (the Pololu's VIN taps
# TP4056 BAT+ directly, not the USB input, so the load side draws from
# the same battery node either way) -- but simultaneous TP4056 charging
# current sharing that same BAT+ node with the Pololu's WiFi-load current
# is a real, untested interaction. ANY FURTHER STAGE 1 TESTING (or Stage
# 2/3) SHOULD HAVE USB PLUGGED INTO TP4056'S CHARGING PORT THROUGHOUT --
# not the ESP32's own port, and not unplugged -- to match the only
# condition the real firmware will ever actually produce.
#
# CURRENT STAGE (as of 2026-08-28): STAGE 0b -- debug UART capture WORKING
# END TO END for the first time in this project's history. Three real
# firmware/framework bugs found and fixed, none of them wiring:
#   1. logger.log: actions default to DEBUG level; this file's logger:
#      level: INFO silently filtered the boot line out entirely, on
#      whichever UART it was routed to. Fixed with an explicit level: WARN.
#   2. The debug component's reset_reason_text is only populated during
#      dump_config() (a pass that runs after every component's setup()),
#      not during setup()/on_boot -- reading it directly in on_boot always
#      returns empty, regardless of priority. Same bug CARD-0217 found on
#      hiking-monitor; same fix: defer the read to the first tick of an
#      interval instead.
#   3. The actual root cause of every prior "zero bytes captured" result,
#      across every session: ESPHome's logger_esp32.cpp calls
#      uart_param_config()/uart_driver_install() for hardware_uart: UART2
#      but never uart_set_pin() -- confirmed by reading the installed
#      esphome package's own source directly. UART1/UART2 have no fixed
#      IO_MUX pin the way UART0 does; without an explicit uart_set_pin()
#      call, the peripheral is configured and running but never actually
#      routed through the GPIO matrix to any physical pin. Fixed with a
#      manual on_boot lambda: uart_set_pin(UART_NUM_2, GPIO_NUM_17, ...).
# Confirmed live 2026-08-28: real, clean "BOOT - reset reason: power-on
# event" text captured over the external adapter on COM7 -- CARD-0205's
# own "done when" is now met on USB power; battery-power confirmation
# will happen naturally once Stage 0 is re-run on battery per CARD-0198.
# NOT YET REACHED: Stage 1 (+WiFi), Stage 2 (+MQTT), Stage 3 (+I2C/SEN55).
#
# Added 2026-08-28: GPIO27 Intent-switch binary_sensor (INPUT_PULLUP,
# inverted, logged on_state via the working UART) -- closes the deferred
# logic-level check from CARD-0218's physical rewiring (a continuity-only
# check was done at the bench since no firmware was reading the pin yet).
# Its own UART capture is unverified (adapter link produced zero bytes
# across two clean attempts, cause not found -- deferred, not blocking).
# Hardware also changed under this same firmware as of 2026-08-28: Pololu
# D24V10F3 replaces the MCP1700, SS12D10 moved to Intent-switch duty, a
# spare SS12D10 stands in for the Power Switch pending the BK-1208.
#
# STAGE 0 / STAGE 0b -- PASS, 2026-08-28. 4 of 4 consecutive clean
# battery-power cycles, one switch-on each, hands off. The cold-power-on
# brownout that was 100% reproducible on the MCP1700 did not recur once
# on the Pololu. Reset-reason logging (Stage 0b) confirmed working in the
# same 4 cycles (3 clean text, 1 blank -- known intermittent reporting
# quirk, not a failure). Full writeup: CARD-0198.
#
# STAGE 1 (+WiFi) -- NOT YET PASSING. 5 trials, 4 of 5 showed the same
# signature: reset reason "brownout" occurring right as WiFi scanning
# starts, then a clean recovery (scan+connect in 2-4s) on the very next
# boot. One trial (1 of 5) hung 90+s, not yet explained. Real, if usually
# brief, instability -- doesn't meet Stage 0's 4-consecutive-clean bar.
#
# Experiment tried 2026-08-28 (delay WiFi's own auto-start past the
# boot-time inrush window via wifi.disable/wifi.enable) -- CLOSED OFF,
# not pursued further: WiFi began scanning almost immediately after
# setup(), before the delay ever elapsed. wifi.disable()/enable() are
# runtime controls for an already-initialized radio, not a way to
# suppress the automatic connection attempt setup() itself
# unconditionally kicks off. Removed from this file 2026-09-08 --
# on_boot and the interval are back to the plain shape that produced
# the original 5-trial Stage 1 characterization below.
#
# SESSION PAUSED 2026-08-28 on an unrelated, unresolved hardware puzzle
# (10uF ceramic regression, then reverting to 4.7uF failed to restore
# Stage 0's previously-clean behavior -- suspected breadboard-row wear,
# unconfirmed). Recommended first step next session: fully re-seat the
# entire ESP32-3V3-pin row (ESP32 pin, Pololu VOUT, SEN55 adapter VIN,
# both bulk caps), not just the capacitor, and re-verify Stage 0 clean
# before trusting anything downstream of it.
#
# STAGE 1 RETEST, 2026-09-08 -- revised power protocol (see
# tos/kanban-board.md CARD-0198, "Revised power protocol" note). Every
# trial above ran on pure battery, USB unplugged everywhere -- a state
# the real gated firmware can never reach, since WiFi only ever enables
# with Intent off AND Power Connected true. This file's wifi: block
# still connects unconditionally (no gating logic here, deliberately --
# this is a component-level power-path question, not a firmware-gating
# simulation), so what changes for this retest is physical: USB must be
# plugged into TP4056's charging port throughout every trial, not the
# ESP32's own port and not unplugged. The prior 5-trial characterization
# (single brownout at WiFi scan start, usually recovers in one retry)
# stays as a real data point but doesn't count as Stage 1 passing or
# failing until re-run under this condition.
#
# STAGE 1 RETEST RESULT -- PASS, 2026-09-08. Real finding before any
# trial even started: the inline Power Switch does NOT isolate the
# shared VIN/BAT+ node from TP4056's own USB-fed charge output --
# measured directly, Pololu VIN reads ~4V with the switch OFF whenever
# USB is in TP4056, identical to switch ON (0V only with BOTH switch
# off AND USB unplugged). Per wiring.md's topology the switch only ever
# cuts the physical LiPo cell's own leg of that node, never TP4056's
# internal charge-FET path onto the same pad -- wiring.md corrected to
# say so. Revised trial mechanism adopted (carried into Stage 2/3):
# switch left OFF for the whole session (isolates the LiPo entirely --
# not drawn down by repeated trials), USB plug/unplug into TP4056 is
# the trial trigger instead. This tests the HARDER case, not an easier
# one -- Pololu powered purely by TP4056's own output, zero battery
# contribution; real docked operation (switch on too) can only be
# easier. Result: 4 of 4 consecutive clean cycles -- boot (reset reason
# power-on event on 3/4, blank on 1/4, same known intermittent quirk
# since Stage 0) -> single WiFi scan -> connect in 1-4s -> stable 90+s,
# zero brownouts, zero retries, all 4 trials. Verified via CARD-0205's
# debug UART (COM9, 115200, captured to a timestamped log file). Full
# writeup: CARD-0198.
#
# STAGE 2 (+MQTT) -- PASS, 2026-09-08. Same trial mechanism as Stage
# 1's retest (switch off, USB plug/unplug into TP4056). Reuses the real
# air-quality-monitor MQTT account/broker (secrets.yaml) with a
# distinct topic_prefix (aqm-minimal-test, not air-quality-monitor) so
# this diagnostic build's traffic can't be confused with the real
# component's -- safe to share the account since the real device isn't
# deployed/running yet (CARD-0012 Step 7 still open). 4 of 4 consecutive
# clean cycles: boot -> WiFi connect (1-3s) -> MQTT connect, zero
# reboots across all 4. One consistent, unrelated finding: MQTT hit
# "Couldn't resolve IP address for 'jctsh.duckdns.org'" on the FIRST
# attempt every single trial, retrying successfully ~4s later -- a real,
# repeatable DNS pattern, not power/brownout-related, not investigated
# further here (worth a look separately sometime). Full writeup:
# CARD-0198.
#
# STAGE 3 (+I2C/SEN55) -- PASS for the docked/upload path, 2026-09-08;
# field/battery path still needed (real gap caught right after, see
# below). Deliberately NOT replicating the real component's
# SEN55-idle-override on_boot dance here -- the goal per CARD-0198's
# own plan is to provoke the coincident-load scenario the Pololu
# redesign was sized for (WiFi association while SEN55 is actively in
# Measurement mode), not protect against it. SEN55's sen5x platform
# auto-starts full Measurement mode (~63mA) at its own setup() (~
# priority 600), which runs before WiFi's setup() (~priority 250) even
# begins -- so with no idle override, SEN55 is already drawing its full
# current by the time WiFi starts scanning moments later, the exact
# overlap this stage needs, with zero extra scripting required to force
# it. 4 of 4 consecutive clean cycles (switch off, USB plug/unplug into
# TP4056, same as Stages 1-2) -- boot -> SEN55 init clean -> WiFi
# connect -> MQTT connect, zero brownouts. One SEN55 I2C error
# ("Failed to write data ready status command") seen once during the
# flash/reset transition, not in any of the 4 counted trials -- not yet
# explained, watch for recurrence.
#
# REAL GAP CAUGHT RIGHT AFTER (Joseph's catch, not found during Build):
# this trial proves the DOCKED/upload path (TP4056 only, LiPo isolated)
# -- it does NOT test the actual field scenario that matters most for
# this device: SEN55 running continuously off the BATTERY ALONE,
# collecting air-quality data untethered, no USB at all. That's a
# genuinely separate condition, never exercised by this stage.
#
# FIELD/BATTERY-ONLY VARIANT -- PASS, 2026-09-08. wifi:/mqtt: removed
# entirely for this round (not gated off, just absent), per Joseph's
# point: real field operation on battery alone should attempt neither
# -- the real gated firmware's dock-detect logic (Step 8) is out of
# scope to replicate here. Tests exactly what matters: does SEN55 (+
# sensors) boot and start collecting cleanly on battery alone, zero
# networking overhead. Trigger: switch off/on (USB fully unplugged
# throughout -- no TP4056 backfeed complication with no USB present at
# all). Run at a recharged, healthy battery voltage (3.8V+) after the
# earlier WiFi+MQTT+SEN55 battery trial drained the cell to its 3.4V
# critical floor (see CARD-0198). 4 of 4 trials held 3+ minutes each
# (extended from the usual ~90s window specifically to cover where the
# WiFi+MQTT case broke down) -- boot -> SEN55 init clean -> steady LED,
# no further activity (expected for this minimal a build), confirmed
# stable each time. ONE UNEXPLAINED ANOMALY: trial 4's initial reset
# reason was "other watchdogs", not "power-on event" like trials 1-3 --
# a genuine ESP32 task/watchdog signature that shouldn't be possible
# for a true cold boot from confirmed 0V. Matches an identical,
# equally-unresolved occurrence from this file's own 2026-08-24
# session. Device recovered and ran stably 3.5+ min after it regardless
# -- real, recurring, but still not root-caused. Full writeup: CARD-0198.
# wifi:/mqtt: blocks kept below in a comment for easy restoration if
# the docked-path stages need re-testing later.
#
# wifi:
#   networks:
#     - ssid: !secret wifi_ssid
#       password: !secret wifi_password
#
# mqtt:
#   id: mqtt_client
#   broker: !secret mqtt_broker
#   port: 8883
#   certificate_authority: !secret mqtt_ca_cert
#   idf_send_async: false
#   username: !secret mqtt_username
#   password: !secret mqtt_password
#   topic_prefix: jctsh/components/aqm-minimal-test
#   discovery: false

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  # SEN55 -- native sen5x platform, same address/pattern as the real
  # component. Auto-starts full Measurement mode (~63mA) at its own
  # setup(), no idle override here -- see the file header's Stage 3
  # note for why that's deliberate. Just enough fields exposed to
  # confirm real, sane readings; the real component's RGB threshold
  # logic isn't relevant to this power-path test.
  - platform: sen5x
    id: sen55
    address: 0x69
    update_interval: 10s
    pm_2_5:
      name: "PM 2.5"
      id: sen55_pm25
      internal: true

esphome:
  name: aqm-minimal-test
  friendly_name: AQM Minimal Test
  on_boot:
    - priority: -100.0
      then:
        # Workaround (2026-08-28): ESPHome's logger_esp32.cpp never calls
        # uart_set_pin() for hardware_uart: UART2 -- it configures and
        # installs the UART2 driver but never routes it through the GPIO
        # matrix to GPIO17, so nothing physically reaches the pin no
        # matter what's logged. Confirmed by reading the installed
        # esphome package's own logger_esp32.cpp source directly (no
        # uart_set_pin call anywhere in the file). Manually doing the
        # routing ESPHome's own component skips.
        - lambda: |-
            uart_set_pin(UART_NUM_2, GPIO_NUM_17, UART_PIN_NO_CHANGE, UART_PIN_NO_CHANGE, UART_PIN_NO_CHANGE);
        - repeat:
            count: 3
            then:
              - output.turn_on: rgb_led_green
              - delay: 300ms
              - output.turn_off: rgb_led_green
              - delay: 300ms

esp32:
  board: esp32dev
  framework:
    type: arduino

debug:

text_sensor:
  - platform: debug
    reset_reason:
      id: reset_reason_text
      internal: true

globals:
  - id: reset_reason_logged
    type: bool
    restore_value: false
    initial_value: 'false'

# Reset-reason read deferred to the first interval tick, not on_boot --
# same fix as CARD-0217 (hiking-monitor): the debug component's
# reset_reason_text is only populated during dump_config(), a separate
# pass that runs after every component's setup() -- reading it directly
# in on_boot always returns empty, regardless of priority.
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return !id(reset_reason_logged);'
          then:
            - logger.log:
                format: "BOOT - reset reason: %s"
                args: ['id(reset_reason_text).state.c_str()']
                level: WARN
            - globals.set:
                id: reset_reason_logged
                value: 'true'

logger:
  level: INFO
  hardware_uart: UART2

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO27
      mode: INPUT_PULLUP
      inverted: true
    name: "Intent Switch"
    id: intent_switch
    on_state:
      then:
        - logger.log:
            format: "Intent switch: %s"
            args: ['x ? "ON (closed)" : "OFF (open)"']
            level: WARN
  # CARD-0012 Step 7 raw check, added 2026-09-08 -- dock-detect divider
  # (TP4056 IN+ -> R3 68k -> midpoint -> R4 100k -> GND), matching the
  # real component's wiring.md exactly. No pull needed, the divider
  # itself sets the logic level. USB absent = LOW (field), USB present
  # in TP4056 = HIGH (docked). Tested here independent of any WiFi-gating
  # behavior, which is Step 8's concern, not this check's.
  - platform: gpio
    pin:
      number: GPIO32
      mode: INPUT
    name: "Dock Detect"
    id: dock_detect
    on_state:
      then:
        - logger.log:
            format: "Dock detect: %s"
            args: ['x ? "HIGH (docked/charging)" : "LOW (field mode)"']
            level: WARN

output:
  - platform: gpio
    pin: GPIO18
    id: rgb_led_red
  - platform: gpio
    pin: GPIO19
    id: rgb_led_green
  - platform: gpio
    pin: GPIO23
    id: rgb_led_blue
