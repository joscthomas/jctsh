name: hike-izer-web

services:
  web:
    container_name: hike-izer-web
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Loopback only -- not reachable from the LAN or WAN directly. Only
      # the M8's own tailscaled daemon (running on the same host) reaches
      # this via loopback; `tailscale funnel` is what actually exposes it
      # publicly, gated by Tailscale's own auth/routing. Chosen over
      # Cloudflare Tunnel's zero-published-port design for now -- see
      # CARD-0088 on kanban-board.md for why (live email on jctnet.com made
      # the nameserver migration Cloudflare Tunnel needed too risky;
      # revisit after CARD-0093 cleans that up, if ever worth it).
      - "127.0.0.1:8090:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./srv:/srv/hike-izer:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      TZ: America/Phoenix
    healthcheck:
      # caddy:2-alpine doesn't define its own HEALTHCHECK, which would
      # leave `docker inspect --format '{{.State.Health.Status}}'`
      # returning an empty string -- photo-server-heartbeat.py treats
      # anything other than "healthy" as unhealthy, so an undefined
      # healthcheck would false-alert every single cycle. wget is present
      # via busybox on caddy:2-alpine; the root path returns 200 via
      # Caddy's `browse` directive even against an empty directory.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  orchestrator:
    # CARD-0086: webhook receiver + generation pipeline for automatic
    # hike-end triggering. Runs as a second service in this same compose
    # project (rather than its own project) so it shares this project's
    # default Docker network with `web` and is reachable from Caddy by
    # service name -- no second Tailscale Funnel port needed, see
    # Caddyfile's /webhook/* route. Built from a Dockerfile (unlike `web`'s
    # off-the-shelf image) since stage 2 needs the anthropic + paho-mqtt pip
    # packages -- see ./orchestrator/Dockerfile.
    container_name: hike-izer-orchestrator
    build: ./orchestrator
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # rw -- stage 2 writes generated summaries/photos directly into the
      # same directory `web` serves, no scp step (unlike the interactive
      # Skill's Windows-based flow).
      - ./srv:/srv/hike-izer
    env_file:
      - .env
    environment:
      TZ: America/Phoenix
      PORT: "8080"
    expose:
      - "8080"
    healthcheck:
      # python3 (the base image itself) hits our own /health endpoint --
      # no extra package needed.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
