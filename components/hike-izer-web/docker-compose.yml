name: hike-izer-web

services:
  web:
    container_name: hike-izer-web
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Loopback only -- not reachable from the LAN or WAN directly via this
      # port. Originally the only public path (via the M8's own tailscaled
      # + `tailscale funnel`, CARD-0088) while jctnet.com still had live
      # email and a nameserver migration was too risky (CARD-0088's
      # reasoning). CARD-0093 cleaned that up, so CARD-0094 (2026-07-27)
      # added the `cloudflared` service below as the new public path --
      # it reaches `web` directly over the compose network (`http://web:80`
      # in cloudflared-config.yml), not through this host port mapping.
      # This loopback binding stays for now as a local-debugging path and
      # until Tailscale Funnel is explicitly turned off as part of cutover.
      - "127.0.0.1:8090:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./srv:/srv/hike-izer:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      TZ: America/Phoenix
    healthcheck:
      # caddy:2-alpine doesn't define its own HEALTHCHECK, which would
      # leave `docker inspect --format '{{.State.Health.Status}}'`
      # returning an empty string -- photo-server-heartbeat.py treats
      # anything other than "healthy" as unhealthy, so an undefined
      # healthcheck would false-alert every single cycle. wget is present
      # via busybox on caddy:2-alpine; the root path returns 200 via
      # Caddy's `browse` directive even against an empty directory.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  orchestrator:
    # CARD-0086: webhook receiver + generation pipeline for automatic
    # hike-end triggering. Runs as a second service in this same compose
    # project (rather than its own project) so it shares this project's
    # default Docker network with `web` and is reachable from Caddy by
    # service name -- no second Tailscale Funnel port needed, see
    # Caddyfile's /webhook/* route. Built from a Dockerfile (unlike `web`'s
    # off-the-shelf image) since stage 2 needs the anthropic + paho-mqtt pip
    # packages -- see ./orchestrator/Dockerfile.
    container_name: hike-izer-orchestrator
    build: ./orchestrator
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # rw -- stage 2 writes generated summaries/photos directly into the
      # same directory `web` serves, no scp step (unlike the interactive
      # Skill's Windows-based flow).
      - ./srv:/srv/hike-izer
    env_file:
      - .env
    environment:
      TZ: America/Phoenix
      PORT: "8080"
    expose:
      - "8080"
    healthcheck:
      # python3 (the base image itself) hits our own /health endpoint --
      # no extra package needed.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    # CARD-0094: public exposure via Cloudflare Tunnel (hikes.jctnet.com),
    # replacing Tailscale Funnel. No published ports -- the tunnel makes an
    # outbound-only connection to Cloudflare's edge and routes
    # hikes.jctnet.com to `web` over this compose project's default Docker
    # network (see cloudflared-config.yml's `service: http://web:80`).
    # Credentials (cert.pem, the tunnel's own credentials JSON) live in the
    # gitignored ./cloudflared/ dir, generated on this host via
    # `cloudflared tunnel login` / `tunnel create` -- never committed.
    container_name: hike-izer-cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - web
