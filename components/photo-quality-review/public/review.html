<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Quality Review</title>
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface-2: #eef0e8;
    --ink: #2b2f27;
    --ink-muted: #5b6156;
    --ink-faint: #8b9186;
    --line: #ddded4;
    --accent: #4b7a3f;
    --accent-ink: #fbfff8;
    --danger: #a3403a;
    --shadow: 0 1px 2px rgba(30,30,20,0.06), 0 6px 16px -8px rgba(30,30,20,0.18);
    --radius: 8px;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171d16; --surface: #212a1f; --surface-2: #28331f;
      --ink: #eef1ea; --ink-muted: #b7c2ae; --ink-faint: #7f8b76;
      --line: #35402f; --accent: #8fc47a; --accent-ink: #16210f;
      --danger: #e08a84;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px -10px rgba(0,0,0,0.5);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; }
  main { max-width: 60rem; margin: 0 auto; padding: 1.5rem 1.25rem 5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  h2 { font-size: 1.1rem; margin: 2rem 0 0.75rem; }
  .subtitle { color: var(--ink-muted); font-size: 0.85rem; margin: 0 0 1.5rem; }

  .year-list { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .year-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 0.9rem 1.2rem; cursor: pointer; text-align: center;
  }
  .year-card:hover { background: var(--surface-2); }
  .year-card .year { font-size: 1.3rem; font-weight: 700; }
  .year-card .count { font-size: 0.75rem; color: var(--ink-muted); }
  /* Nothing actionable left this year (CARD-0028, Joseph's call) -- no
     click handler is attached at all, this is purely the visual signal to
     match. Re-enables itself (a plain .year-card again) the moment a
     re-scan finds something new. */
  .year-card.is-done { cursor: default; opacity: 0.55; }
  .year-card.is-done:hover { background: var(--surface); }

  .dismiss-singles-btn {
    display: block; margin: 0 0 0.9rem; font-size: 0.8rem; color: var(--accent);
    background: none; border: 1px solid var(--accent); border-radius: var(--radius);
    padding: 0.4rem 0.7rem; cursor: pointer;
  }
  .dismiss-singles-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Paging within a year (CARD-0028) -- a plain, low-emphasis button since
     it's a browsing aid, not a decision; distinct from dismiss-singles-btn's
     accent color so the two aren't confused at a glance. */
  .load-more-btn {
    display: block; margin: 0.6rem 0 1.2rem; font-size: 0.8rem; color: var(--ink-muted);
    background: none; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 0.4rem 0.7rem; cursor: pointer;
  }
  .load-more-btn:hover { background: var(--surface-2); color: var(--ink); }

  .back-link { display: inline-block; margin-bottom: 1rem; color: var(--ink-muted); text-decoration: none; font-size: 0.9rem; }
  .back-link:hover { text-decoration: underline; }
  .hide-decided-toggle {
    display: block; font-size: 0.85rem; color: var(--ink-muted); margin-bottom: 0.5rem; cursor: pointer;
  }
  .hide-decided-toggle input { margin-right: 0.4rem; vertical-align: middle; }

  .group {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 0.9rem; margin-bottom: 0.9rem;
  }
  .group-row { display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: flex-start; }
  .item { text-align: center; width: 140px; }
  .item img {
    width: 140px; height: 140px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line);
    display: block; margin-bottom: 0.35rem;
  }
  .item .fname { font-size: 0.7rem; color: var(--ink-faint); word-break: break-all; margin-bottom: 0.3rem; }
  .item .fmeta { font-size: 0.68rem; color: var(--ink-muted); margin-bottom: 0.3rem; }
  .item .owner-badge {
    display: inline-block; font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.03em; padding: 0.1rem 0.4rem; border-radius: 999px; margin-bottom: 0.3rem;
  }
  .item .owner-badge.owner-joseph { background: #dce8f5; color: #2c5a86; }
  .item .owner-badge.owner-robin { background: #f5dcec; color: #8a2c62; }
  @media (prefers-color-scheme: dark) {
    .item .owner-badge.owner-joseph { background: #223447; color: #a9c9e8; }
    .item .owner-badge.owner-robin { background: #452232; color: #e8a9cc; }
  }
  .item .album-badge { font-size: 0.68rem; margin-bottom: 0.3rem; }
  .item .album-badge.has-album { color: var(--accent); font-weight: 600; }
  .item .album-badge.no-album { color: var(--ink-faint); font-style: italic; }
  .item .motion-badge:not(:empty) { font-size: 0.68rem; margin-bottom: 0.3rem; }
  .item .motion-badge.motion-ok { color: var(--accent); }
  .item .motion-badge.motion-broken { color: var(--danger); font-weight: 700; }
  .item .auto-tag { color: var(--accent); font-style: italic; font-weight: 400; }
  .item a.thumb-link { display: block; }
  .item a.view-link { font-size: 0.7rem; color: var(--accent); text-decoration: none; }
  .item a.view-link:hover { text-decoration: underline; }
  .item label { display: block; font-size: 0.8rem; margin-top: 0.3rem; cursor: pointer; }

  .skip-btn {
    align-self: center; font-size: 0.8rem; color: var(--ink-muted); background: none;
    border: 1px solid var(--line); border-radius: var(--radius); padding: 0.3rem 0.6rem; cursor: pointer;
  }
  .skip-btn.active { background: var(--surface-2); color: var(--ink); }

  .delete-all-btn {
    align-self: center; font-size: 0.8rem; color: var(--danger); background: none;
    border: 1px solid var(--danger); border-radius: var(--radius); padding: 0.3rem 0.6rem; cursor: pointer;
  }
  .delete-all-btn.active { background: var(--danger); color: white; }

  .keep-all-btn {
    align-self: center; font-size: 0.8rem; color: var(--accent); background: none;
    border: 1px solid var(--accent); border-radius: var(--radius); padding: 0.3rem 0.6rem; cursor: pointer;
  }
  .keep-all-btn.active { background: var(--accent); color: var(--accent-ink); }

  /* CARD-0155 "super rule" box -- deliberately not styled like .group (no
     thumbnails ever live in here), a plain callout instead so it reads as
     "a rule fired," not "here's a photo to look at." */
  .super-rule-box {
    background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 0.9rem 1.1rem; margin-bottom: 0.9rem; font-size: 0.85rem;
  }
  .super-rule-box p { margin: 0 0 0.6rem; }
  .super-rule-box p:last-child { margin-bottom: 0; }
  .super-rule-pending { border-color: var(--line); color: var(--ink-muted); }
  .super-rule-note { color: var(--ink-muted); font-size: 0.8rem; font-style: italic; }
  .super-rule-delete-btn {
    font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: var(--radius);
    border: 1px solid var(--danger); background: var(--danger); color: white;
    font-weight: 600; cursor: pointer;
  }

  .toggle-btn {
    font-size: 0.75rem; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 0.25rem 0.55rem; cursor: pointer; background: var(--surface); color: var(--ink-muted); width: 100%;
  }
  .toggle-btn.marked-delete { background: var(--danger); color: white; border-color: var(--danger); font-weight: 600; }
  /* Singles only ever have two states now -- unmarked (implicitly kept) or
     marked for deletion (Joseph's call, 2026-08-06: no separate "keep"
     click). Decided (marked-delete) items dim slightly so the eye is drawn
     to what's still unmarked, full opacity on hover. */
  .item.is-decided { opacity: 0.55; }
  .item.is-decided:hover { opacity: 1; }

  .grid { display: flex; flex-wrap: wrap; gap: 0.8rem; }

  .tally-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
    border-top: 1px solid var(--line); box-shadow: 0 -4px 16px -8px rgba(0,0,0,0.2);
    padding: 0.8rem 1.25rem; display: flex; align-items: center; justify-content: center; gap: 1rem;
  }
  .tally-bar button {
    font-size: 0.9rem; padding: 0.5rem 1rem; border-radius: var(--radius); border: 1px solid var(--line);
    cursor: pointer; background: var(--surface);
  }
  .tally-bar button.primary { background: var(--danger); color: white; border-color: var(--danger); }
  .tally-count { font-size: 0.9rem; color: var(--ink-muted); }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    align-items: center; justify-content: center; z-index: 10;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    max-width: 40rem; width: 90%; max-height: 80vh; overflow-y: auto; padding: 1.25rem;
  }
  .modal ul { padding-left: 1.2rem; font-size: 0.85rem; }
  .spinner {
    display: inline-block; width: 0.9em; height: 0.9em; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    vertical-align: -0.15em; margin-right: 0.4em; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Deleting-in-progress feedback (CARD-0028) -- the old text-only spinner
     line inside an already-open modal turned out to be easy to miss (Joseph:
     no visible countdown noticed on a real 10+ item batch), especially since
     it's immediately followed by a native alert() that grabs full attention.
     A real progress bar is a much harder-to-miss signal than a single line
     of text changing in place. Hidden by default, shown only while a
     confirm is actually running. */
  .progress-bar {
    display: none; height: 0.6rem; border-radius: 999px; background: var(--surface-2);
    overflow: hidden; margin: 0.6rem 0;
  }
  .progress-bar.active { display: block; }
  .progress-bar-fill {
    height: 100%; width: 0%; background: var(--accent); transition: width 0.2s ease-out;
  }
  .modal-summary-text { font-size: 1rem; font-weight: 600; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1rem; }
  .modal-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty { color: var(--ink-faint); font-style: italic; }

  /* In-page toast (replaces native alert()) -- alert()/confirm() dialogs are
     rendered by the browser chrome itself, which always prefixes them with
     the page's own origin ("100.111.16.14 says") for security reasons; no
     amount of JS can suppress that. This is a plain styled notification
     instead, message-only, auto-dismissing. */
  .toast {
    display: none; position: fixed; top: 1.25rem; left: 50%; transform: translateX(-50%);
    z-index: 20; max-width: 32rem; width: calc(100% - 2.5rem);
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 0.8rem 1.1rem; font-size: 0.9rem; text-align: center;
  }
  .toast.open { display: block; }
  .toast.error { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>
<main id="app">
  <h1>Photo Quality Review</h1>
  <p class="subtitle" id="subtitle">Loading...</p>
  <div id="content"></div>
</main>

<div class="toast" id="toast"></div>

<div class="tally-bar" id="tallyBar" style="display:none">
  <span class="tally-count" id="tallyCount">0 marked for deletion</span>
  <button id="previewBtn">Preview Deletions</button>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 style="margin-top:0">Confirm Deletions</h2>
    <p id="modalSummary" class="modal-summary-text"></p>
    <ul id="modalList"></ul>
    <p id="confirmProgressText" class="modal-summary-text"></p>
    <div class="progress-bar" id="progressBar"><div class="progress-bar-fill" id="progressBarFill"></div></div>
    <div class="modal-actions">
      <button id="cancelBtn">Cancel</button>
      <button class="toggle-btn marked-delete" id="confirmBtn" style="width:auto">Confirm &amp; Delete</button>
    </div>
  </div>
</div>

<!-- Mark-remaining-as-reviewed progress (CARD-0028) -- a plain informational
     modal, no Cancel/Confirm choice, since there's nothing to confirm: the
     click already committed to the action, this just shows it's genuinely
     working on a large batch rather than appearing to hang. -->
<div class="modal-backdrop" id="dismissModalBackdrop">
  <div class="modal">
    <h2 style="margin-top:0">Marking as Reviewed</h2>
    <p id="dismissProgressText" class="modal-summary-text"></p>
    <div class="progress-bar" id="dismissProgressBar"><div class="progress-bar-fill" id="dismissProgressBarFill"></div></div>
  </div>
</div>

<!-- CARD-0155 "super rule" delete-all confirmation -- no itemized list by
     design (see the box's own comment in review.js): this rule's entire
     point is not showing these photos, so the confirmation is a count only,
     same shape/progress treatment as the main Confirm Deletions modal. -->
<div class="modal-backdrop" id="superRuleModalBackdrop">
  <div class="modal">
    <h2 style="margin-top:0">Delete Exact Duplicates from Robin's Library</h2>
    <p id="superRuleModalSummary" class="modal-summary-text"></p>
    <p id="superRuleProgressText" class="modal-summary-text"></p>
    <div class="progress-bar" id="superRuleProgressBar"><div class="progress-bar-fill" id="superRuleProgressBarFill"></div></div>
    <div class="modal-actions">
      <button id="superRuleCancelBtn">Cancel</button>
      <button class="toggle-btn marked-delete" id="superRuleConfirmBtn" style="width:auto">Confirm &amp; Delete</button>
    </div>
  </div>
</div>

<script src="/public/review.js"></script>
</body>
</html>
