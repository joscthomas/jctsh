- id: '1778983120577'
  alias: Garage Presence - Restart timer on activity
  triggers:
  - entity_id: binary_sensor.garage_motion_motion
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.back_door_door
    trigger: state
  - entity_id: binary_sensor.garage_cam_motion
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.back_door_acceleration
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.garage_radar_presence
    to: 'on'
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ trigger.entity_id == 'binary_sensor.garage_radar_presence'\n
      \  or is_state('binary_sensor.garage_radar_presence', 'unavailable')\n   or
      is_state('binary_sensor.garage_radar_presence', 'unknown') }}\n"
  actions:
  - target:
      entity_id: timer.garage_presence_timer
    data:
      duration: '{{ (states(''input_number.garage_timer_duration'') | int) * 60 }}'
    action: timer.start
  - action: switch.turn_on
    target:
      entity_id: switch.garage_presence_vswitch
  mode: restart
- id: '1778983177377'
  alias: Garage Presence - Timer expired
  triggers:
  - event_type: timer.finished
    event_data:
      entity_id: timer.garage_presence_timer
    trigger: event
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.garage_presence_vswitch
  mode: single
- id: '1779139332231'
  alias: Garage Presence - Sync timer to vswitch
  triggers:
  - entity_id: switch.garage_presence_vswitch
    to: 'on'
    trigger: state
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: switch.garage_presence_vswitch
    state: 'on'
  actions:
  - target:
      entity_id: timer.garage_presence_timer
    data:
      duration: '{{ (states(''input_number.garage_timer_duration'') | int) * 60 }}'
    action: timer.start
  mode: single
- id: '1779303195499'
  alias: Garage Presence - Radar keepalive
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id: binary_sensor.garage_radar_presence
    state: 'on'
  actions:
  - target:
      entity_id: timer.garage_presence_timer
    data:
      duration: '{{ (states(''input_number.garage_timer_duration'') | int) * 60 }}'
    action: timer.start
  - action: switch.turn_on
    target:
      entity_id: switch.garage_presence_vswitch
  mode: single
- id: '1779459034707'
  alias: Garage Presence Vswitch → MQTT
  description: ''
  triggers:
  - entity_id: switch.garage_presence_vswitch
    trigger: state
  actions:
  - data:
      topic: jctsh/components/garage-presence-vswitch/state
      payload: '{{ ''ON'' if trigger.to_state.state == ''on'' else ''OFF'' }}'
      retain: true
      qos: 0
    action: mqtt.publish
  mode: single
- id: '1781208697396'
  alias: Front Porch Warm - Close Door
  triggers:
  - value_template: "{{ states('sensor.front_porch_temp_sensor_temperature') | float\n
      \  > states('input_number.front_porch_temp_threshold') | float + 2\n   and now().hour
      >= 7 and now().hour < 12 }}\n"
    for: 00:10:00
    trigger: template
  actions:
  - data:
      title: Front Porch Warm
      message: '{{ now().strftime(''%I:%M %p'') }} — Front porch is {{ states(''sensor.front_porch_temp_sensor_temperature'')
        | round(1) }}°F. Consider closing the door.

        '
    action: notify.mobile_app_pixel_10_pro_xl
  - data:
      title: Front Porch Warm
      message: '{{ now().strftime(''%I:%M %p'') }} — Front porch is {{ states(''sensor.front_porch_temp_sensor_temperature'')
        | round(1) }}°F. Consider closing the door.

        '
    action: notify.mobile_app_pixel_7_pro
  - delay: '05:00:00'
  mode: single
- id: '1781208739282'
  alias: Front Porch Cool - Open Door
  triggers:
  - value_template: "{{ states('sensor.front_porch_temp_sensor_temperature') | float\n
      \  < states('input_number.front_porch_temp_threshold') | float - 2\n   and now().hour
      >= 6 and now().hour < 10 }}\n"
    for: 00:10:00
    trigger: template
  actions:
  - data:
      title: Front Porch Cool
      message: '{{ now().strftime(''%I:%M %p'') }} — Front porch is {{ states(''sensor.front_porch_temp_sensor_temperature'')
        | round(1) }}°F. Good time to open the door.

        '
    action: notify.mobile_app_pixel_10_pro_xl
  - data:
      title: Front Porch Cool
      message: '{{ now().strftime(''%I:%M %p'') }} — Front porch is {{ states(''sensor.front_porch_temp_sensor_temperature'')
        | round(1) }}°F. Good time to open the door.

        '
    action: notify.mobile_app_pixel_7_pro
  - delay: '04:00:00'
  mode: single
- id: '1785200000001'
  alias: Traveling Lights - Randomize Daily Times
  description: >-
    CARD-0098. Regenerates the on/off clock times for the traveling-lights
    presence simulation every night at 3am, so the actual time varies day to
    day instead of firing at the exact same minute every night. Always
    enabled -- harmless when the automation below is toggled off.
    On-time is tied to sun.sun's next_setting (not a fixed clock window) so
    it tracks Tucson's real sunset swing (~5:25pm Dec to ~7:35pm Jun) rather
    than firing while it's still bright in summer or staying dark well past
    dusk in winter.
  triggers:
  - trigger: time
    at: '03:00:00'
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.traveling_lights_on_time
    data:
      time: "{{ as_local(as_datetime(state_attr('sun.sun', 'next_setting'))\
        \ + timedelta(minutes=range(0,36)|random)).strftime('%H:%M:%S') }}"
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.traveling_lights_off_time
    data:
      time: "{{ (today_at('22:00') + timedelta(minutes=range(0,91)|random)).strftime('%H:%M:%S') }}"
  mode: single
- id: '1785200000002'
  alias: Traveling Lights
  description: >-
    CARD-0098 presence simulation while traveling. Single on/off toggle
    (Settings > Automations) covers both directions -- toggle on before a
    trip, off after. Two triggers, tagged 'on'/'off', fire at
    input_datetime.traveling_lights_on_time/off_time (both re-randomized
    nightly by "Traveling Lights - Randomize Daily Times") and a choose
    block runs the matching branch. Both entities are in the same room, so
    each event shuffles the order and staggers each light with a random
    1-5 min gap -- looks like someone moving through the room, not a single
    master-switch flip.
  triggers:
  - trigger: time
    at: input_datetime.traveling_lights_on_time
    id: 'on'
  - trigger: time
    at: input_datetime.traveling_lights_off_time
    id: 'off'
  actions:
  - variables:
      lights_order: "{{ ['light.nook', 'light.pendants'] | shuffle }}"
      lights_names: "{{ lights_order | map('state_attr', 'friendly_name') | join(', ') }}"
  - choose:
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - repeat:
          for_each: "{{ lights_order }}"
          sequence:
          - delay: "00:0{{ range(1,6) | random }}:00"
          - action: homeassistant.turn_on
            target:
              entity_id: "{{ repeat.item }}"
      - data:
          title: Traveling Lights
          message: "{{ now().strftime('%I:%M %p') }} — Turned on: {{ lights_names }}. TV: {{ states('media_player.groom_tv') }}."
        action: notify.mobile_app_pixel_10_pro_xl
      - data:
          title: Traveling Lights
          message: "{{ now().strftime('%I:%M %p') }} — Turned on: {{ lights_names }}. TV: {{ states('media_player.groom_tv') }}."
        action: notify.mobile_app_pixel_7_pro
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - repeat:
          for_each: "{{ lights_order }}"
          sequence:
          - delay: "00:0{{ range(1,6) | random }}:00"
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ repeat.item }}"
      - data:
          title: Traveling Lights
          message: "{{ now().strftime('%I:%M %p') }} — Turned off: {{ lights_names }}. TV: {{ states('media_player.groom_tv') }}."
        action: notify.mobile_app_pixel_10_pro_xl
      - data:
          title: Traveling Lights
          message: "{{ now().strftime('%I:%M %p') }} — Turned off: {{ lights_names }}. TV: {{ states('media_player.groom_tv') }}."
        action: notify.mobile_app_pixel_7_pro
  mode: single
- id: '1786600000001'
  alias: Traveling Mode - Unexpected TV Activity
  description: >-
    CARD-0150. Real-time alert both ways if the Groom TV's power state
    changes while the Traveling Lights toggle is on (Settings > Automations
    > Traveling Lights -- the same CARD-0098 toggle that gates the
    presence-simulation lights), since nobody should be home to be using it.
    Two triggers tagged 'on'/'off', mirroring the Traveling Lights
    automation's own on/off choose-block pattern. Keys off
    media_player.groom_tv's Cast-integration state transitioning between
    off/unavailable/unknown and an in-use state (playing/idle/paused/
    buffering) -- not a fixed list of states alone -- so each direction
    fires once per real transition, not on every intra-session state churn
    (this entity can cycle through playing/idle/paused several times a
    second during actual use). The 'off' direction exists so that turning
    the TV off remotely via Google Home after an 'on' alert (the expected
    response) gets its own confirmation, instead of leaving Joseph to
    guess whether the remote power-off actually took. Root-cause
    investigation (CARD-0150) could not pin down what turned the TV on
    during the July 25-Aug 11 2026 trip -- every source checkable (HA
    automations, JCTsh/ESP32 logs, Google Home cast activity, TV timers,
    SmartThings routines) came back clean, and HA's own history for this
    entity had an unexplained 24h gap over the incident window besides.
    This automation exists so a repeat is caught live instead of
    reconstructed after the fact.
    Each branch waits 2 minutes after the transition, then re-checks the
    entity is still in the new category before notifying -- a real live
    test caught this entity dropping to 'unavailable' for ~67s during
    confirmed active use (a Cast-protocol connectivity blip, not a real
    power change), which would otherwise fire a false 'off' alert (and
    likely a follow-up false 'on' alert on recovery). A plain trigger-level
    `for:` was considered and rejected -- HA's `for` requires the exact
    same state value to hold the whole time, but this entity legitimately
    churns between playing/idle/paused/buffering during real use, so a
    same-value `for` would rarely if ever satisfy during genuine use.
    The delay-then-recheck-category pattern tolerates that churn while
    still filtering the observed blip.
    mode: restart, not single -- a second real live test (off, then back on
    14s later) caught `single` silently dropping both notifications: the
    'off' branch's in-progress delay meant the 'on' transition was ignored
    entirely (not queued), and by the time the 'off' branch's own recheck
    ran the TV was on again, so it failed its own condition too. `restart`
    means a newer trigger cancels the in-flight delay and starts over from
    the latest transition, so rapid back-and-forth collapses into one
    notification for the final settled state instead of losing both.
  triggers:
  - trigger: state
    entity_id: media_player.groom_tv
    from:
    - 'off'
    - unavailable
    - unknown
    to:
    - playing
    - idle
    - paused
    - buffering
    id: 'on'
  - trigger: state
    entity_id: media_player.groom_tv
    from:
    - playing
    - idle
    - paused
    - buffering
    to:
    - 'off'
    - unavailable
    - unknown
    id: 'off'
  conditions:
  - condition: state
    entity_id: automation.traveling_lights_evening_on
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - delay: 00:02:00
      - condition: state
        entity_id: media_player.groom_tv
        state:
        - playing
        - idle
        - paused
        - buffering
      - data:
          title: Traveling Mode - TV Alert
          message: "{{ now().strftime('%I:%M %p') }} — Groom TV turned on (Chromecast status: {{ states('media_player.groom_tv') }}) while traveling."
        action: notify.mobile_app_pixel_10_pro_xl
      - data:
          title: Traveling Mode - TV Alert
          message: "{{ now().strftime('%I:%M %p') }} — Groom TV turned on (Chromecast status: {{ states('media_player.groom_tv') }}) while traveling."
        action: notify.mobile_app_pixel_7_pro
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - delay: 00:02:00
      - condition: state
        entity_id: media_player.groom_tv
        state:
        - 'off'
        - unavailable
        - unknown
      - data:
          title: Traveling Mode - TV Alert
          message: "{{ now().strftime('%I:%M %p') }} — Groom TV turned off (Chromecast status: {{ states('media_player.groom_tv') }})."
        action: notify.mobile_app_pixel_10_pro_xl
      - data:
          title: Traveling Mode - TV Alert
          message: "{{ now().strftime('%I:%M %p') }} — Groom TV turned off (Chromecast status: {{ states('media_player.groom_tv') }})."
        action: notify.mobile_app_pixel_7_pro
  mode: restart
- id: '1786800000001'
  alias: CARD-0145 - Ring Motion Announcement
  description: >-
    Spoken TTS announcement on Google Home speakers when motion fires on
    any of 5 Ring cameras/doorbell (gate, path, front door, front porch,
    doorbell), via `sensor.*_last_activity` (polled, ~60s cadence) with
    a `category == 'motion'` filter.

    2026-08-18 (CARD-0184): switched back to `sensor.*_last_activity`
    for good, after confirming `event.*_motion` (the push-based
    alternative, used since 2026-08-15) is durably broken, not
    transient. Diagnosed live: `event.*_motion` state values stayed
    frozen at 2026-08-15 timestamps through two independent real-world
    tests (a confirmed real walk-by at the gate and front porch,
    verified via `sensor.*_last_activity` picking it up correctly)
    across BOTH a full HA restart (`docker restart homeassistant`,
    2026-08-18 15:35 MST) AND a full Ring integration delete-and-
    re-authenticate (2026-08-18, Joseph's own action) -- ruling out both
    a stuck process and a stale/corrupted auth session as the cause.
    Matches a known upstream bug, home-assistant/core#128597. Source
    inspection of the installed `ring` integration (HA 2026.8.2,
    `ring_doorbell` 0.9.14) confirms the push path runs through a
    separate `RingListenCoordinator`/`RingEventListener` that, per its
    own source, logs only a WARNING if it fails to start and has no
    visible retry logic -- consistent with a silent, permanent stall
    rather than a recoverable blip. `sensor.*_last_activity`'s ~60s
    cadence comes from `RingDataCoordinator`'s `SCAN_INTERVAL =
    timedelta(minutes=1)` in the integration's own `const.py` -- hardcoded
    in HA core source, not exposed as a user-configurable option
    anywhere in the integration's config/options flow, so the delay
    is not adjustable without patching HA core itself (not something to
    hand-maintain against upstream updates). Findings queued to be
    filed on the upstream issue.

    2026-08-15 history (first time this was tried): briefly switched to
    `sensor.*_last_activity` after `event.*_motion` appeared to stop
    delivering live events entirely (frozen since setup despite genuine
    Ring push notifications/video reaching Joseph's phone). That switch
    introduced two new problems: `sensor.*_last_activity` reflects ANY
    camera activity, not just motion (fixed with a `category ==
    'motion'` condition after a false "Motion at Gathering Room"
    announcement), and it's polled rather than pushed -- a real motion
    event didn't reach the automation for 60-90+ seconds (confirmed:
    multiple cameras' `last_activity` entities updated within 11ms of
    each other, consistent with a shared poll cycle, not live per-event
    delivery). That delay was worse than the outage it was working
    around at the time, so **reverted back to `event.*_motion`
    2026-08-15** (Joseph's call -- working theory then was a transient
    Ring/HA cloud-side relay issue that might clear on its own; revisit
    if `event.*_motion` was still frozen after 2026-08-16 -- it was,
    confirmed 2026-08-18, see above). The `category` filter condition
    removed on that revert is restored here, permanently this time.

    All debounce/queue/entry-cluster logic below is unchanged throughout
    every switch. Prior revision history, 2026-08-15: the original
    `for: 10s` trigger debounce delayed every
    single announcement by a full 10s, and separately `mode: parallel`
    let near-simultaneous triggers overlap their tts.cloud_say calls on
    the same speakers -- both unacceptable. Now: no `for:` on the trigger
    (first announcement plays immediately), `mode: queued` (max 20) so
    only one announcement plays at a time system-wide across all 9
    cameras, and a trailing `delay: 3s` at the end of the action
    sequence so the next queued announcement can't start until 3s after
    the previous one began (tuned down from 10s -> 5s -> 3s across live
    tests; 3s chosen after confirming even the longest phrase, "Motion
    at Gathering Room", finishes with margin to spare -- not
    mathematically airtight against a worst-case slow-dispatch + long-
    phrase combination, but every real test has been clean; a
    wait-for-actual-playback-to-finish design was considered and not
    chosen in favor of this simpler fixed delay). This also means two
    real re-fires for one visit on the SAME camera (e.g. the original
    doorbell double-fire, 4.9s apart) will play as two separate
    announcements rather than being collapsed into one -- a tradeoff
    against the immediate-first-play requirement.

    Entry-cluster suppression, added 2026-08-15: Front Porch, Front
    Door, and Doorbell are physically clustered at the same entry point,
    so a single visitor walking up commonly trips two or three of them
    in sequence for what should be one announcement. `entry_cluster` +
    `entry_cluster_suppressed` (variables) implement first-one-wins: if
    a trigger is one of these 3 entities and another member of the same
    cluster changed state within the last 30s, this run is suppressed
    via a template condition evaluated at trigger time (before queuing,
    using state as of the moment each event fires, not as of whenever
    the run would eventually be dequeued). Applies only to this 3-camera
    cluster -- the other 6 cameras are unaffected and each still gets
    its own independent announcement.

    camera_messages and camera_quiet_hours are empty by
    design (standard message, no quiet hours for all 9 to start) but
    structured as per-entity-id lookups so either can be set for an
    individual camera later without restructuring the automation.
  triggers:
  - trigger: state
    entity_id:
    - sensor.gate_last_activity
    - sensor.path_last_activity
    - sensor.front_door_last_activity
    - sensor.front_porch_last_activity
    - sensor.doorbell_last_activity
  variables:
    camera_names:
      sensor.gate_last_activity: Gate
      sensor.path_last_activity: Path
      sensor.front_door_last_activity: Front Door
      sensor.front_porch_last_activity: Front Porch
      sensor.doorbell_last_activity: Doorbell
    camera_messages: {}
    camera_quiet_hours: {}
    quiet_hours: "{{ camera_quiet_hours.get(trigger.entity_id) }}"
    in_quiet_hours: >-
      {{ quiet_hours is not none and (
           (quiet_hours.start < quiet_hours.end and quiet_hours.start <= now().strftime('%H:%M') < quiet_hours.end)
           or
           (quiet_hours.start >= quiet_hours.end and (now().strftime('%H:%M') >= quiet_hours.start or now().strftime('%H:%M') < quiet_hours.end))
         ) }}
    entry_cluster:
    - sensor.front_porch_last_activity
    - sensor.front_door_last_activity
    - sensor.doorbell_last_activity
    entry_cluster_suppressed: >-
      {% set ns = namespace(suppress=false) %}
      {% if trigger.entity_id in entry_cluster %}
        {% for eid in entry_cluster if eid != trigger.entity_id %}
          {% set lc = states[eid].last_changed if states[eid] else none %}
          {% if lc is not none and (now() - lc).total_seconds() < 30 %}
            {% set ns.suppress = true %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {{ ns.suppress }}
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state.attributes.get('category') == 'motion' }}"
  - condition: template
    value_template: "{{ not in_quiet_hours }}"
  - condition: template
    value_template: "{{ not entry_cluster_suppressed }}"
  actions:
  - action: tts.cloud_say
    target:
      entity_id:
      - media_player.garage_speaker
      - media_player.groom_speaker
      - media_player.master_bedroom_speaker
    data:
      message: >-
        {{ camera_messages.get(trigger.entity_id, 'Motion at ' ~
        camera_names.get(trigger.entity_id, trigger.entity_id)) }}
  - delay:
      seconds: 3
  mode: queued
  max: 20
