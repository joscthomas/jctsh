    note: "RoboForm: no private key needed -- a lost key is regenerated and re-authorized, not recovered. What makes that possible is the M8 login password (m8-login-password) being in RoboForm. Rotating it means generating ONE new key and placing it in both profiles. Optionally record the public-key fingerprint so a stray key in authorized_keys is recognizable."
    holders:
      - {where: "M8 /home/jct/.ssh/authorized_keys (this key, plus a separate command-restricted backup key -- see pi-backup-to-m8-ssh-key)", kind: scripted, verified: true, verify: "ssh -o BatchMode=yes jct@m8.local true, from each profile"}
      - {where: "~/.ssh/id_ed25519 in BOTH Windows profiles -- one key file copied, so the private key exists in two places", kind: manual, verified: true, verify: "ssh -o BatchMode=yes jct@m8.local true, from each profile (this profile confirmed; public-key fingerprint identical in both)"}

