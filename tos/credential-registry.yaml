# JCTsh credential registry -- CARD-0372 (automated rotation), seeded by CARD-0334 Step 0.
#
# VALUES-FREE BY RULE: this file names credentials, says where each one lives, and
# tracks rotation state. It never contains a secret value, a prefix, or a hash of
# one. Safe to commit. Values live in RoboForm (Joseph's system of record) and, once
# built, the shared KeePassXC vault (CARD-0372 decision 0 = B2). This registry is the
# source of truth for the INVENTORY (what exists, where it is used, how to rotate and
# verify it, when it was last rotated) -- not for values.
#
# Seeded 2026-09-29 from `credentials.local.md`'s structure, CARD-0334's inventory and
# what this repo's code reads. Entries marked `verified: false` on a holder were taken
# from those notes, not checked live -- confirm before a recipe relies on them.
#
# Fields
#   id            stable name used by `rotate <id>`
#   what          one-line description
#   class         api-key | token | password | signing-secret | device-secret | ssh-key | provider-key
#   tier          1 (API keys/tokens, 180d) | 2 (passwords, 365d) | 3 (device secrets, incident-driven)
#   interval_days rotation interval; null = incident-driven
#   last_rotated  ISO date, or `unknown` (nothing recorded)
#   exposed       dated transcript/log exposures (CARD-0334, CARD-0367, CARD-0365) -- a rotation trigger
#   in_creds_file true if a value is currently in credentials.local.md (to be removed once the vault exists)
#   roboform      yes | no | unknown  -- JOSEPH TO FILL IN (RoboForm is not visible to sessions)
#   roboform_synced  false until Joseph confirms the paste after a rotation (CARD-0372)
#   dual_accept   true if the server can accept old+new during a window
#   automation    scripted | partial | manual | out-of-scope  (initial read)
#   holders       every place the value must be updated. kind: scripted | manual
#                 verify: how a recipe confirms that holder works with the new value

credentials:

  - id: data-pipeline-api-key
    what: Shared secret for every data-pipeline-api route (Authorization Bearer)
    class: api-key
    tier: 1
    interval_days: 180
    last_rotated: unknown   # created during CARD-0349 (~2026-09-28); no exact date recorded
    exposed: [2026-09-29 Caddy access log + session transcript (CARD-0365/CARD-0334)]
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    dual_accept: true       # API_KEY_PREVIOUS + API_KEY_PREVIOUS_EXPIRES (gateway v2026-09-29.4)
    automation: partial     # servers scripted; phones manual
    pilot: true             # CARD-0370
    holders:
      - {where: "M8 ~/data-pipeline-app/.env", var: API_KEY, kind: scripted, verified: true, verify: "GET /version and /auth-status with the new key"}
      - {where: "M8 ~/hike-izer-web-app/.env", var: DATA_PIPELINE_KEY, kind: scripted, verified: true, verify: "orchestrator sheet_health.check + fetch_table"}
      - {where: "Pi Node-RED environment", var: DATA_PIPELINE_KEY, kind: scripted, verified: false, verify: "next real reading lands; /auth-status shows current key on /environmental-data", note: "exact source (environment file vs global-config env) to confirm"}
      - {where: "GPSLogger Headers field (each phone profile if more than one)", kind: manual, verified: true, verify: "/auth-status last_seen /gps shows the new key"}
      - {where: "Tasker Flush Observation Queue, action 8 header", kind: manual, verified: true, verify: "/auth-status last_seen /hiking-observations shows the new key"}

  - id: apps-script-api-key
    what: RETIRED Google Apps Script API_KEY (Environmental Data pipeline)
    class: api-key
    tier: 1
    interval_days: 365
    last_rotated: unknown
    exposed: [2026-09-29 dashboard log + session transcript (CARD-0367); earlier partial exposure 2026-09-23 (CARD-0332); old Tasker export in git history]
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    dual_accept: false
    automation: out-of-scope   # endpoint is write-retired; disposition is discard-or-rotate at the Apps Script, not a holder rollout
    holders:
      - {where: "Apps Script script property API_KEY", kind: manual, verified: false, verify: "n/a -- retired endpoint"}
      - {where: "leftover copies: M8/Pi jctsh.log*, git history of the Tasker export", kind: manual, verified: true, verify: "judge harmless or scrub (CARD-0370)"}

  - id: webhook-secret
    what: hike-izer-orchestrator webhook shared secret (?key= on /webhook/*), also used by the gateway's log relay
    class: signing-secret
    tier: 1
    interval_days: 180
    last_rotated: unknown
    exposed: []
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    dual_accept: false      # orchestrator accepts one value; would need the same dual-accept work
    automation: partial
    holders:
      - {where: "M8 ~/hike-izer-web-app/.env", var: WEBHOOK_SECRET, kind: scripted, verified: true, verify: "POST /webhook/pipeline-log returns 200"}
      - {where: "M8 ~/data-pipeline-app/.env", var: WEBHOOK_SECRET, kind: scripted, verified: true, verify: "gateway relay reaches the orchestrator"}
      - {where: "other /webhook/* callers (Tasker profiles, hike-end webhook)", kind: manual, verified: false, verify: "TODO -- enumerate", note: "orchestrator webhook auth still uses ?key= (CARD-0365 left it out of scope)"}

  - id: netalertx-webhook-secret
    what: Signs NetAlertX webhook POSTs so Node-RED can verify them (CARD-0078)
    class: signing-secret
    tier: 1
    interval_days: 180
    last_rotated: unknown
    exposed: [2026-09-23 transcript (CARD-0332), 2026-09-29 transcript (CARD-0334)]
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    dual_accept: false
    automation: partial     # both holders must change together or alerts stop
    holders:
      - {where: "NetAlertX publisher settings (M8)", kind: manual, verified: false, verify: "next new-device alert arrives"}
      - {where: "Pi /home/pi/.node-red/environment", var: NETALERTX_WEBHOOK_SECRET, kind: scripted, verified: false, verify: "signature check passes on a test webhook"}

  - id: ha-token
    what: Home Assistant long-lived access token (one token shared by four consumers today)
    class: token
    tier: 1
    interval_days: 180
    last_rotated: unknown
    exposed: [2026-09-23 (CARD-0332), 2026-09-24 (CARD-0334)]
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    dual_accept: true       # HA supports multiple long-lived tokens; mint new, revoke old
    automation: scripted    # blocked on CARD-0332 (plaintext copy in flows.json) and best done per-consumer (CARD-0334 Phase 3)
    holders:
      - {where: "Pi /home/pi/.node-red/environment", var: HA_TOKEN, kind: scripted, verified: true, verify: "an HA REST call from Node-RED succeeds"}
      - {where: "Pi Node-RED global-config env inside flows.json (world-readable, CARD-0332)", kind: scripted, verified: true, verify: "flow using it still calls HA"}
      - {where: "M8 photo-tv-display .env", var: HA_TOKEN, kind: scripted, verified: false, verify: "TODO"}
      - {where: "M8 ~/hike-izer-web-app/.env", var: HA_TOKEN, kind: scripted, verified: false, verify: "ha_notify.send_push succeeds (CARD-0141)"}
      - {where: "Claude Code sessions (via the vault helper once built)", kind: scripted, verified: false, verify: "sec run HA call"}

  - id: node-red-admin-password
    what: Node-RED admin login (bcrypt hash in settings.js)
    class: password
    tier: 2
    interval_days: 365
    last_rotated: unknown
    exposed: [2026-09-24, 2026-09-28 (CARD-0334)]
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    dual_accept: false
    automation: scripted    # short cutover; restart of Node-RED needed
    holders:
      - {where: "Pi /home/pi/.node-red/settings.js adminAuth hash", kind: scripted, verified: true, verify: "POST /auth/token with the new password"}

  - id: log-dashboard-password
    what: Log server dashboard Basic Auth (user jctsh)
    class: password
    tier: 2
    interval_days: 365
    last_rotated: unknown
    exposed: []
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    dual_accept: false
    automation: scripted
    holders:
      - {where: "Pi /etc/jctsh/log-server.env", var: DASHBOARD_PASS, kind: scripted, verified: true, verify: "authenticated /status returns 200 after service restart"}

  - id: mosquitto-accounts
    what: One MQTT account per component (allow_anonymous false); 12 accounts
    class: password
    tier: 2   # server-side accounts; device copies are tier 3 (see esp32-device-secrets)
    interval_days: 365
    last_rotated: unknown   # cadence table: "not recorded anywhere" for nodered/homeassistant
    exposed: [2026-09-24 (CARD-0334): jctsh-log-server, hiking-monitor, photo-server, netalertx, ring-mqtt, air-quality-monitor, hike-izer-orchestrator, front-porch, back-patio]
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    dual_accept: false      # no ACLs and one password per account
    automation: partial     # broker + server consumers scripted; ESP32s need a rebuild; HA MQTT config is UI-only
    accounts:
      jctsh-log-server: {holder: "Pi /etc/jctsh/log-server.env", kind: scripted}
      nodered: {holder: "Node-RED broker node (encrypted credentials)", kind: scripted}
      homeassistant: {holder: "HA UI only (Settings > Devices > MQTT)", kind: manual}
      garage-radar: {holder: "components/garage-radar/secrets.yaml + C:\\esphome copy + firmware", kind: manual}
      salt-sensor: {holder: "components/salt-sensor/secrets.h + firmware", kind: manual}
      front-porch-temp-sensor: {holder: "secrets.yaml + C:\\esphome copy + firmware", kind: manual}
      back-patio-temp-sensor: {holder: "secrets.yaml + C:\\esphome copy + firmware", kind: manual}
      hiking-monitor: {holder: "secrets.yaml + C:\\esphome copy + firmware", kind: manual}
      air-quality-monitor: {holder: "sketch secrets + firmware", kind: manual}
      photo-server: {holder: "M8 /etc/jctsh/heartbeat.env", kind: scripted}
      hike-izer-orchestrator: {holder: "M8 ~/hike-izer-web-app/.env (MQTT_USERNAME/MQTT_PASSWORD)", kind: scripted}
      ring-mqtt: {holder: "M8 ring-mqtt container config", kind: scripted}
      netalertx: {holder: "NetAlertX MQTT settings (M8)", kind: manual}
    broker_holder: {where: "Pi /etc/mosquitto/passwd (hashed) -- chown root:mosquitto after any mosquitto_passwd", kind: scripted, verified: true}

  - id: esp32-device-secrets
    what: ESPHome/Arduino OTA + MQTT secrets compiled into firmware; some values shared across the four original ESP32 components
    class: device-secret
    tier: 3
    interval_days: null
    last_rotated: unknown
    exposed: [2026-09-24 (CARD-0334): front-porch and back-patio OTA+MQTT, hiking-monitor mqtt/ota]
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    dual_accept: false
    automation: partial     # scriptable with ESPHome (rebuild + OTA) but a per-device event
    holders:
      - {where: "components/<name>/secrets.yaml (gitignored) and its C:\\esphome\\<name>\\ copy", kind: manual, verified: true, verify: "esphome compile then OTA succeeds with the new value"}
      - {where: "generated .esphome/build/**/main.cpp (contains compiled-in secrets; delete build trees, CARD-0334 Phase 1d)", kind: manual, verified: true, verify: "n/a -- delete"}

  - id: ha-robin-password
    what: Robin's Home Assistant account password
    class: password
    tier: 2
    interval_days: 365
    last_rotated: unknown
    exposed: []
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    automation: manual      # belongs to Robin
    holders:
      - {where: "Home Assistant user account", kind: manual, verified: false, verify: "login"}

  - id: pi-and-m8-ssh
    what: SSH access to the Pi (pi) and M8 (jct) -- key auth from the workstation; login passwords also set
    class: ssh-key
    tier: 2
    interval_days: 365
    last_rotated: 2026-07-10   # M8 jct password per the cadence table; key ages not recorded
    exposed: []
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    automation: out-of-scope   # first scope excludes SSH keys
    holders:
      - {where: "~/.ssh/id_ed25519 in EACH Windows profile (two profiles), authorized on pi and m8", kind: manual, verified: true, verify: "ssh -o BatchMode=yes"}

  - id: netalertx-password
    what: NetAlertX web UI password
    class: password
    tier: 2
    interval_days: 365
    last_rotated: 2026-07-12
    exposed: []
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    automation: manual
    holders:
      - {where: "NetAlertX (M8)", kind: manual, verified: false, verify: "login"}

  - id: router-admin-password
    what: TP-Link Archer AXE75 admin password
    class: password
    tier: 2
    interval_days: 365
    last_rotated: 2026-07-09
    exposed: []
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    automation: manual
    holders:
      - {where: "router admin UI", kind: manual, verified: false, verify: "login"}

  - id: immich-credentials
    what: Immich account passwords (Joseph, Robin), the two personal API keys, the internal Postgres DB_PASSWORD, and the orchestrator's IMMICH_KEY
    class: api-key
    tier: 1
    interval_days: 180
    last_rotated: unknown   # cadence table: API keys "not yet -- exposed 2026-08-11" (CARD-0076), account passwords fill-in
    exposed: [2026-08-11 (CARD-0076)]
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    automation: partial     # Immich API keys can be minted/revoked via its API; account passwords are manual
    holders:
      - {where: "Immich web UI (account passwords, API keys)", kind: manual, verified: false, verify: "login / API call"}
      - {where: "M8 ~/hike-izer-web-app/.env", var: IMMICH_KEY, kind: scripted, verified: false, verify: "fetch_hike_photos.py search succeeds"}
      - {where: "M8 photo-server docker-compose env", var: DB_PASSWORD, kind: manual, verified: false, verify: "compose up; internal only"}

  - id: github-pat-maintenance
    what: GitHub personal access token for the maintenance-check auto-PR pipeline
    class: token
    tier: 1
    interval_days: 180
    last_rotated: 2026-07-31   # created
    exposed: []
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    automation: manual      # created in GitHub's UI
    holders:
      - {where: "M8/Pi maintenance-check environment (to confirm)", kind: scripted, verified: false, verify: "open_kanban_pr.py opens a PR"}

  - id: deletion-log-apps-script-key
    what: photo-tv-display deletion-log Apps Script key (DELETION_LOG_SHEET_APPS_SCRIPT_KEY)
    class: api-key
    tier: 1
    interval_days: 365
    last_rotated: unknown
    exposed: [2026-09-29 session transcript (CARD-0334)]
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    automation: partial
    holders:
      - {where: "Apps Script script property API_KEY (components/photo-tv-display/apps-script.gs)", kind: manual, verified: false, verify: "deletion log write succeeds"}
      - {where: "M8 photo-tv-display .env", kind: scripted, verified: false, verify: "TODO"}

  - id: provider-keys
    what: Provider-issued keys that cannot be regenerated locally -- Thunderforest (365d), Xeno-canto (365d, signed up 2026-08-16), DuckDNS token, Cloudflare tunnel credentials, Ubuntu Pro token, Anthropic API key (orchestrator .env)
    class: provider-key
    tier: 1
    interval_days: 365
    last_rotated: unknown   # DuckDNS token: fill-in; Xeno-canto 2026-08-16 (signed up)
    exposed: []
    in_creds_file: true     # Anthropic key: unknown -- confirm where it lives
    roboform: unknown
    roboform_synced: null
    automation: out-of-scope   # a lost value means minting a new one at the provider; the RoboForm copy matters most here
    holders:
      - {where: "M8 ~/hike-izer-web-app/.env (THUNDERFOREST_API_KEY, XENO_CANTO key, ANTHROPIC_API_KEY)", kind: scripted, verified: false, verify: "hike-izer run succeeds"}
      - {where: "DuckDNS update client (Pi/router)", kind: manual, verified: false, verify: "DNS still updates"}
      - {where: "M8 hike-izer-web-app Cloudflare Tunnel credentials", kind: manual, verified: false, verify: "hikes.jctnet.com reachable"}
