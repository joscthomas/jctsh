  - id: home-wifi-password
    what: Home WiFi network password (WPA passphrase) -- compiled into every ESP32 component and entered on every household device that uses WiFi
    class: password
    tier: 2
    interval_days: 365
    last_rotated: unknown
    exposed: [2026-10-02 (CARD-0334 fourth occurrence): full print of the credentials file]
    in_creds_file: unknown   # not checked -- added 2026-10-02 from the components' secrets.yaml usage, not from credentials.local.md
    roboform: no             # new entry 2026-10-02 -- Joseph flips this once a RoboForm entry exists
    rotation_declined: null
    roboform_synced: null
    dual_accept: false       # one passphrase per SSID; changing it drops every device until each is updated
    automation: manual       # router setting + six firmware rebuilds + every phone/laptop/TV/hub by hand
    note: "Added 2026-10-02 (CARD-0372, Joseph). Highest-disruption credential in the registry: rotating it disconnects every WiFi device at once, and each ESP32 must be reflashed over USB or before the change (a device that can't join WiFi can't take an OTA). Not yet inventoried: whether the router runs more than one SSID/band with separate passphrases, and the full list of non-ESP32 household devices on WiFi."
    holders:
      - {where: "router wireless settings (TP-Link Archer AXE75)", kind: manual, verified: false, verify: "a phone joins with the new passphrase"}
