  - id: ha-joseph-login
    what: "Joseph's Home Assistant login -- through the Nabu Casa / Google account, so there is no separate Home Assistant password"
    class: federated-login
    tier: 2
    interval_days: null     # the password belongs to Google / Nabu Casa, not to JCTsh -- nothing here to rotate on a cadence
    last_rotated: unknown
    exposed: []
    in_creds_file: false    # credentials.local.md holds only the pointer "Nabu Casa / Google account", no value
    roboform: yes
    roboform_synced: null
    automation: out-of-scope
    note: "RoboForm: nothing new -- the credential that matters is the Google account's password and its 2-step recovery, normally already saved as your Google login. Renamed from ha-joseph-password (2026-09-30): credentials.local.md's Home Assistant table listed Joseph's Password cell as the pointer *(Nabu Casa / Google account)*, which the first registry pass misread as a password. Why it still matters: Nabu Casa is required for the SmartThings integration (OAuth callback), so losing access to that account breaks SmartThings setup -- see root CLAUDE.md."
    holders:
      - {where: "The Google account that Home Assistant Cloud (Nabu Casa) is signed in with -- owned by Google / Nabu Casa, not by JCTsh", kind: manual, verified: false, verify: "sign in to Home Assistant with the Google / Nabu Casa login"}

