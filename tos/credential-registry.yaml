  - id: ha-token
    what: Home Assistant long-lived access token (one token shared by four consumers today)
    class: token
    tier: 1
    interval_days: 180
    last_rotated: unknown
    exposed: [2026-09-23 (CARD-0332), 2026-09-24 (CARD-0334), 2026-10-02 (CARD-0334 fourth occurrence): full credentials.local.md print]
    in_creds_file: true
    roboform: yes
    roboform_synced: null
