# JCTsh credential registry -- CARD-0372 (automated rotation), seeded by CARD-0334 Step 0.
#
# VALUES-FREE BY RULE: this file names credentials, says where each one lives, and
# tracks rotation state. It never contains a secret value, a prefix, or a hash of
# one. Safe to commit. Values live in RoboForm (Joseph's system of record) and, once
# built, the shared KeePassXC vault (CARD-0372 decision 0 = B2). This registry is the
# source of truth for the INVENTORY (what exists, where it is used, how to rotate and
# verify it, when it was last rotated) -- not for values.
#
# Seeded 2026-09-29 from `credentials.local.md`'s structure, CARD-0334's inventory and
# what this repo's code reads. Entries marked `verified: false` on a holder were taken
# from those notes, not checked live -- confirm before a recipe relies on them.
#
# Fields
#   id            stable name used by `rotate <id>`
#   what          one-line description
#   class         api-key | token | password | signing-secret | device-secret | ssh-key | provider-key | federated-login
#   tier          1 (API keys/tokens, 180d) | 2 (passwords, 365d) | 3 (device secrets, incident-driven)
#   interval_days rotation interval; null = incident-driven
#   last_rotated  ISO date, or `unknown` (nothing recorded)
#   exposed       dated transcript/log exposures (CARD-0334, CARD-0367, CARD-0365) -- a rotation trigger
#   rotation_requested  null, or "<date>: <reason> (<who>)" -- an explicit ask to rotate this credential on
#                 the next pass, independent of exposed/cadence (e.g. the value is lost/unrecorded, or Joseph
#                 just wants it changed). On a grouped entry (mosquitto-accounts, immich-credentials, etc.)
#                 this goes on the specific sub-account/holder, not the top-level id, since the other
#                 sub-accounts aren't necessarily affected. Cleared (set back to null) once rotated.
#   in_creds_file true if a value is currently in credentials.local.md (to be removed once the vault exists)
#   RoboForm entry name = the id above. A grouped entry (one id, several secrets -- see `accounts:` on
#                 mosquitto-accounts, or the several Immich/ESP32/provider secrets) uses <id>--<sub-name>, e.g.
#                 mosquitto-accounts--log-server. RoboForm names cannot contain a slash, and no id contains "--".
#   roboform      yes | no | unknown  -- JOSEPH TO FILL IN (RoboForm is not visible to sessions)
#   roboform_synced  false until Joseph confirms the paste after a rotation (CARD-0372)
#   dual_accept   true if the server can accept old+new during a window
#   automation    scripted | partial | manual | out-of-scope  (initial read)
#   note          optional free text: what RoboForm should hold, hazards, context
#   holders       every place the value must be updated. kind: scripted | manual
#                 verify: how a recipe confirms that holder works with the new value

credentials:


  - id: apps-script-api-key
    what: RETIRED Google Apps Script API_KEY (Environmental Data pipeline)
    class: api-key
    tier: 1
    interval_days: 365
    last_rotated: unknown
    exposed: [2026-09-29 dashboard log + session transcript (CARD-0367); earlier partial exposure 2026-09-23 (CARD-0332); old Tasker export in git history; 2026-09-30 confirmed in two tracked Tasker exports + history, repo confirmed PUBLIC (CARD-0375) -- lowest priority of that scan, endpoint already write-retired]
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    dual_accept: false
    automation: out-of-scope   # endpoint is write-retired; disposition is discard-or-rotate at the Apps Script, not a holder rollout
    holders:
      - {where: "Apps Script script property API_KEY", kind: manual, verified: false, verify: "n/a -- retired endpoint"}
      - {where: "leftover copies: M8/Pi jctsh.log*, git history of the Tasker export", kind: manual, verified: true, verify: "judge harmless or scrub (CARD-0370)"}

  - id: data-pipeline-api-key
    what: Shared secret for every data-pipeline-api route (Authorization Bearer)
    class: api-key
    tier: 1
    interval_days: 180
    last_rotated: unknown   # created during CARD-0349 (~2026-09-28); no exact date recorded
    exposed: [2026-09-29 Caddy access log + session transcript (CARD-0365/CARD-0334)]
    in_creds_file: true
    roboform: unknown
    roboform_synced: null
    dual_accept: true       # API_KEY_PREVIOUS + API_KEY_PREVIOUS_EXPIRES (gateway v2026-09-29.4)
    automation: partial     # servers scripted; phones manual
    pilot: true             # CARD-0370
    holders:
      - {where: "M8 ~/data-pipeline-app/.env", var: API_KEY, kind: scripted, verified: true, verify: "GET /version and /auth-status with the new key"}
      - {where: "M8 ~/hike-izer-web-app/.env", var: DATA_PIPELINE_KEY, kind: scripted, verified: true, verify: "orchestrator sheet_health.check + fetch_table"}
      - {where: "Pi Node-RED environment", var: DATA_PIPELINE_KEY, kind: scripted, verified: false, verify: "next real reading lands; /auth-status shows current key on /environmental-data", note: "exact source (environment file vs global-config env) to confirm"}
      - {where: "GPSLogger Headers field (each phone profile if more than one)", kind: manual, verified: true, verify: "/auth-status last_seen /gps shows the new key"}
      - {where: "Tasker Flush Observation Queue, action 8 header", kind: manual, verified: true, verify: "/auth-status last_seen /hiking-observations shows the new key"}

