    note: "RoboForm: a Login entry (host m8.local, user jct, this password). Day to day it is barely used -- key auth and NOPASSWD sudo do the work -- so its real job is the way back in: console login, or re-adding a key if the key is lost. CHECKED 2026-09-29: sshd on the M8 has PasswordAuthentication YES, so this is a live SSH login credential on the LAN, not just a console fallback -- and with NOPASSWD sudo its strength matters. The M8 is also the internet-facing host (Cloudflare tunnel), which is why it is tracked separately from the Pi. Hardening candidate: turn PasswordAuthentication off, making it console-only like the Pi."
    holders:
      - {where: "M8 account `jct` (set with passwd)", kind: manual, verified: false, verify: "console login, or SSH password login if PasswordAuthentication is on"}

